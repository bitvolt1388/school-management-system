<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITVOLT Messenger 💎</title>
    <script src="https://cdn.ably.com/lib/ably.min-1.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0f0c29;
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            max-height: 700px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-wrap: wrap;
            gap: 8px;
        }
        .logo {
            font-size: 22px;
            font-weight: 900;
        }
        .logo span {
            color: #f7971e;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .user-info .name {
            color: #f7971e;
            font-weight: 600;
            font-size: 14px;
        }
        .user-info .balance {
            background: rgba(247, 151, 30, 0.15);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #ffd700;
        }
        .btn-logout {
            background: rgba(255, 0, 0, 0.12);
            border: none;
            color: #ff6b6b;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-logout:hover {
            background: rgba(255, 0, 0, 0.25);
        }
        .online-badge {
            background: rgba(0, 255, 0, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            color: #4caf50;
        }
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px 5px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .messages::-webkit-scrollbar {
            width: 4px;
        }
        .messages::-webkit-scrollbar-thumb {
            background: #f7971e;
            border-radius: 10px;
        }
        .msg {
            max-width: 78%;
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 14px;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        .msg.me {
            align-self: flex-end;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a2e;
            border-bottom-right-radius: 4px;
        }
        .msg.other {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-bottom-left-radius: 4px;
        }
        .msg .msg-name {
            font-size: 11px;
            opacity: 0.7;
            display: block;
        }
        .msg .msg-time {
            font-size: 10px;
            opacity: 0.5;
            margin-right: 6px;
        }
        .system-msg {
            text-align: center;
            color: rgba(255, 255, 255, 0.2);
            font-size: 13px;
            padding: 10px;
        }
        .input-area {
            display: flex;
            gap: 10px;
            padding: 10px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .input-area input {
            flex: 1;
            padding: 12px 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .input-area input:focus {
            border-color: #f7971e;
        }
        .input-area input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .input-area button {
            padding: 12px 25px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            border: none;
            border-radius: 15px;
            color: #1a1a2e;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }
        .input-area button:hover {
            transform: scale(1.03);
        }
        .footer {
            text-align: center;
            padding-top: 10px;
            color: rgba(255, 255, 255, 0.1);
            font-size: 11px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }
        .footer span {
            color: #f7971e;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @media (max-width: 500px) {
            .app {
                max-height: 100vh;
                border-radius: 0;
                padding: 12px;
            }
            .logo {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- هدر -->
        <div class="header">
            <div class="logo">💎 BIT<span>VOLT</span></div>
            <div class="user-info">
                <span class="name" id="userName">کاربر</span>
                <span class="balance" id="userBalance">💰 ۰ تومان</span>
                <span class="online-badge" id="onlineCount">🟢 ۱ آنلاین</span>
                <button class="btn-logout" onclick="logout()">🚪 خروج</button>
            </div>
        </div>

        <!-- پیام‌ها -->
        <div class="messages" id="messages">
            <div class="system-msg">🔌 در حال اتصال...</div>
        </div>

        <!-- ورودی -->
        <div class="input-area">
            <input type="text" id="msgInput" placeholder="پیامت رو بنویس..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">📨 ارسال</button>
        </div>

        <div class="footer">
            ساخته شده توسط <span>BITVOLT.MTV</span>
        </div>
    </div>

    <script>
        // ==========================================
        // 🔑 کلید Ably (رایگان - از سایت ably.com بگیر)
        // ==========================================
        // برای شروع، از این کلید استفاده کن (تا ۱۰۰ پیام در روز رایگان)
        // یا برو به https://ably.com/sign-up و کلید خودت رو بگیر
        const ABLY_API_KEY = 'YOUR_ABLY_API_KEY'; // <-- کلید خودت رو اینجا بذار

        // ==========================================
        // مدیریت کاربر
        // ==========================================
        let currentUser = localStorage.getItem('bitvolt_user') || null;
        let users = JSON.parse(localStorage.getItem('bitvolt_users')) || {};

        if (!currentUser) {
            let name = prompt('👤 نام کاربری خود را وارد کن:', 'کاربر_' + Math.floor(Math.random() * 1000));
            if (name) {
                currentUser = name.trim();
                localStorage.setItem('bitvolt_user', currentUser);
                if (!users[currentUser]) {
                    users[currentUser] = { balance: 100000, wins: 0 };
                    localStorage.setItem('bitvolt_users', JSON.stringify(users));
                }
            } else {
                location.reload();
            }
        }

        document.getElementById('userName').textContent = currentUser;
        document.getElementById('userBalance').textContent = `💰 ${users[currentUser]?.balance?.toLocaleString() || 0} تومان`;

        // ==========================================
        // اتصال به Ably
        // ==========================================
        let ably = null;
        let channel = null;
        let isConnected = false;

        function connectAbly() {
            try {
                ably = new Ably.Realtime(ABLY_API_KEY);
                channel = ably.channels.get('bitvolt-chat');

                channel.subscribe('message', (msg) => {
                    const data = msg.data;
                    addMessage(data.name, data.text, data.time, data.name === currentUser);
                });

                ably.connection.on('connected', () => {
                    isConnected = true;
                    document.getElementById('messages').innerHTML = '';
                    addSystemMessage('✅ به سرور BITVOLT متصل شدی!');
                    updateOnlineCount();
                });

                ably.connection.on('disconnected', () => {
                    isConnected = false;
                    addSystemMessage('❌ ارتباط با سرور قطع شد!');
                });

                // ارسال پیام آنلاین بودن
                setInterval(() => {
                    if (isConnected) {
                        channel.publish('presence', {
                            name: currentUser,
                            status: 'online'
                        });
                    }
                }, 5000);

            } catch (error) {
                addSystemMessage('⚠️ خطا در اتصال به سرور! لطفاً کلید Ably را تنظیم کن.');
                console.error('Ably Error:', error);
            }
        }

        // ==========================================
        // تعداد آنلاین‌ها (شبیه‌سازی)
        // ==========================================
        let onlineUsers = new Set();

        function updateOnlineCount() {
            onlineUsers.add(currentUser);
            document.getElementById('onlineCount').textContent = `🟢 ${onlineUsers.size} آنلاین`;
        }

        // شبیه‌سازی کاربران آنلاین دیگه
        setInterval(() => {
            if (isConnected && Math.random() < 0.3) {
                const fakeNames = ['Ali_Reza', 'Sara_2024', 'Milad_Pro', 'Nazanin_Art', 'Hossein_Dev'];
                const randomName = fakeNames[Math.floor(Math.random() * fakeNames.length)];
                if (randomName !== currentUser) {
                    onlineUsers.add(randomName);
                    document.getElementById('onlineCount').textContent = `🟢 ${onlineUsers.size} آنلاین`;
                }
            }
        }, 10000);

        // ==========================================
        // ارسال پیام
        // ==========================================
        function sendMessage() {
            let input = document.getElementById('msgInput');
            let text = input.value.trim();
            if (!text) return;
            if (!isConnected) {
                addSystemMessage('⚠️ به سرور متصل نیستی!');
                return;
            }

            let data = {
                name: currentUser,
                text: text,
                time: new Date().toLocaleTimeString('fa-IR')
            };

            channel.publish('message', data);
            addMessage(data.name, data.text, data.time, true);
            input.value = '';
        }

        // ==========================================
        // نمایش پیام
        // ==========================================
        function addMessage(name, text, time, isMe) {
            let container = document.getElementById('messages');
            // حذف پیام سیستمی اتصال
            if (container.children.length === 1 && container.children[0].classList.contains('system-msg')) {
                container.innerHTML = '';
            }
            let div = document.createElement('div');
            div.className = `msg ${isMe ? 'me' : 'other'}`;
            div.innerHTML = `
                <span class="msg-name">${name}</span>
                ${text}
                <span class="msg-time">${time}</span>
            `;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function addSystemMessage(text) {
            let container = document.getElementById('messages');
            let div = document.createElement('div');
            div.className = 'system-msg';
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        // ==========================================
        // خروج
        // ==========================================
        function logout() {
            localStorage.removeItem('bitvolt_user');
            location.reload();
        }

        // ==========================================
        // راه‌اندازی
        // ==========================================
        connectAbly();

        setTimeout(() => {
            addSystemMessage(`👋 ${currentUser} عزیز به BITVOLT خوش آمدی!`);
        }, 1000);

        // ارسال با Enter
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.activeElement.id === 'msgInput') {
                sendMessage();
            }
        });
    </script>

</body>
</html>
