<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>چت بین دستگاهی</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet" />
    
    <!-- PeerJS for cross-device communication -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: #1a2332;
            --bg-input: #0d1522;
            --border-color: #2a3d5c;
            --text-primary: #e8f0fe;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --accent-green: #22d3ee;
            --accent-yellow: #fbbf24;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--accent-blue); border-radius: 10px; }

        .app {
            width: 1000px;
            max-width: 100%;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.04);
            height: calc(100vh - 32px);
            max-height: 800px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .app::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(59, 130, 246, 0.03), transparent, rgba(139, 92, 246, 0.03), transparent);
            animation: rotateGlow 40s linear infinite;
            pointer-events: none;
        }
        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== AUTH ===== */
        .auth-container {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(20px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius);
        }
        .auth-container.active { display: flex; }
        .auth-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--shadow);
            animation: modalPop 0.3s ease;
            position: relative;
            z-index: 101;
        }
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .auth-box .logo {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 6px;
        }
        .auth-box .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .auth-box .form-group {
            margin-bottom: 14px;
        }
        .auth-box .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .auth-box .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }
        .auth-box .form-group input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .auth-box .btn-full {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.25);
        }
        .auth-box .btn-full:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
        }
        .auth-box .auth-switch {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .auth-box .auth-switch a {
            color: var(--accent-blue);
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-box .auth-switch a:hover { text-decoration: underline; }
        .auth-box .error-msg {
            color: #ef4444;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
        .auth-box .error-msg.show { display: block; }

        /* ===== HEADER ===== */
        .header {
            display: none;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            background: var(--bg-card);
            border-radius: 60px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
            position: relative;
            z-index: 1;
        }
        .header.active { display: flex; }
        .header .brand {
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header .user-info .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: white;
        }
        .header .user-info .name {
            font-size: 14px;
            font-weight: 600;
        }
        .header .connection-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }
        .header .connection-status.connected {
            color: var(--accent-green);
            border-color: rgba(34, 211, 238, 0.2);
            background: rgba(34, 211, 238, 0.1);
        }
        .header .connection-status.disconnected {
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.2);
            background: rgba(239, 68, 68, 0.1);
        }
        .header .connection-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        .header .connection-status.connected .dot { background: var(--accent-green); }
        .header .connection-status.disconnected .dot { background: #ef4444; }
        
        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.3);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
        }
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        .btn-sm {
            padding: 4px 12px;
            font-size: 11px;
        }

        /* ===== CHAT AREA ===== */
        .chat-area {
            display: none;
            flex: 1;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        .chat-area.active { display: flex; }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 18px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 8px;
        }
        .chat-header .info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-header .info .icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
        }
        .chat-header .info .title {
            font-size: 15px;
            font-weight: 700;
        }
        .chat-header .info .status {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .chat-header .info .status.online {
            color: var(--accent-green);
        }

        /* ===== MESSAGES ===== */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--bg-input);
        }
        .chat-messages .empty {
            text-align: center;
            color: var(--text-secondary);
            padding: 60px 0;
            font-size: 15px;
        }
        .chat-messages .empty i {
            font-size: 40px;
            display: block;
            margin-bottom: 12px;
            color: var(--border-color);
        }

        .message {
            max-width: 82%;
            padding: 8px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            animation: msgIn 0.15s ease;
        }
        .message.own {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.other {
            background: var(--bg-card);
            color: var(--text-primary);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }
        .message.system {
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.2);
            color: var(--accent-yellow);
            align-self: center;
            max-width: 90%;
            text-align: center;
            font-size: 13px;
            padding: 6px 20px;
            border-radius: 30px;
        }
        .message .msg-user {
            font-weight: 700;
            font-size: 12px;
            color: var(--accent-yellow);
            display: block;
            margin-bottom: 2px;
        }
        .message .msg-time {
            font-size: 10px;
            color: var(--text-secondary);
            margin-right: 8px;
        }
        .message.own .msg-time {
            color: rgba(255, 255, 255, 0.6);
        }
        .message .msg-seen {
            font-size: 11px;
            color: var(--accent-green);
            margin-right: 4px;
        }
        .message .msg-media {
            max-width: 100%;
            border-radius: 12px;
            margin: 4px 0;
            cursor: pointer;
        }
        .message .msg-media img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .message .msg-media video {
            max-width: 100%;
            max-height: 250px;
            border-radius: 12px;
            background: #000;
        }
        .message .msg-audio {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 12px;
            background: var(--bg-input);
            border-radius: 30px;
            margin: 4px 0;
            min-width: 180px;
        }
        .message .msg-audio audio {
            flex: 1;
            height: 30px;
            border-radius: 20px;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== TYPING ===== */
        .typing-indicator {
            padding: 4px 18px;
            font-size: 12px;
            color: var(--text-secondary);
            min-height: 28px;
            display: none;
            align-items: center;
            gap: 6px;
        }
        .typing-indicator.show { display: flex; }
        .typing-indicator .dots span {
            display: inline-block;
            width: 5px;
            height: 5px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typingDot 1.4s infinite;
            margin: 0 1px;
        }
        .typing-indicator .dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingDot {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-5px); opacity: 1; }
        }

        /* ===== INPUT ===== */
        .chat-input-area {
            display: flex;
            gap: 8px;
            padding: 8px 14px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-card);
            flex-shrink: 0;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .chat-input-area .wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border-radius: 40px;
            padding: 2px 6px 2px 14px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            min-width: 0;
        }
        .chat-input-area .wrapper:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .chat-input-area .wrapper input {
            flex: 1;
            padding: 9px 6px;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            min-width: 50px;
        }
        .chat-input-area .wrapper input::placeholder {
            color: var(--text-secondary);
        }
        .chat-input-area .wrapper .tool-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 5px;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .chat-input-area .wrapper .tool-btn:hover {
            color: var(--accent-yellow);
        }
        .chat-input-area .wrapper .tool-btn.record {
            color: #ef4444;
        }
        .chat-input-area .wrapper .tool-btn.record.recording {
            animation: pulseRecord 1s infinite;
        }
        @keyframes pulseRecord {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        .chat-input-area .send-btn {
            padding: 9px 20px;
            border: none;
            border-radius: 40px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .chat-input-area .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
        }
        .chat-input-area .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            max-width: 90%;
        }
        .toast {
            padding: 10px 22px;
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            animation: slideUp 0.3s ease;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
        }
        .toast.success { border-color: #10b981; }
        .toast.error { border-color: #ef4444; }
        .toast.info { border-color: var(--accent-blue); }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== DEVICE ID DISPLAY ===== */
        .device-id-box {
            display: none;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            margin-bottom: 12px;
            font-size: 13px;
            color: var(--text-secondary);
            position: relative;
            z-index: 1;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .device-id-box.active { display: flex; }
        .device-id-box .id-label {
            font-weight: 600;
            color: var(--text-primary);
        }
        .device-id-box .id-value {
            background: var(--bg-card);
            padding: 4px 12px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 12px;
            color: var(--accent-yellow);
            flex: 1;
            min-width: 100px;
            word-break: break-all;
        }
        .device-id-box .copy-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            transition: var(--transition);
        }
        .device-id-box .copy-btn:hover {
            border-color: var(--accent-blue);
            color: var(--text-primary);
        }

        @media (max-width: 600px) {
            .app { padding: 10px; height: calc(100vh - 20px); max-height: none; }
            .header { padding: 6px 12px; }
            .header .brand { font-size: 16px; }
            .message { max-width: 92%; font-size: 13px; padding: 6px 12px; }
            .chat-messages { padding: 10px 12px; }
            .chat-input-area { padding: 6px 8px; gap: 4px; }
            .chat-input-area .wrapper input { font-size: 13px; padding: 7px 4px; }
            .chat-input-area .send-btn { padding: 7px 14px; font-size: 13px; }
            .auth-box { padding: 24px 20px; margin: 10px; }
            .device-id-box { font-size: 12px; padding: 8px 12px; }
        }
    </style>
</head>
<body>

    <div class="app" id="app">

        <!-- ===== AUTH ===== -->
        <div class="auth-container active" id="authContainer">
            <div class="auth-box">
                <div class="logo">📡 چت‌بین‌دستگاهی</div>
                <div class="subtitle">با دوستان خود در هر دستگاهی چت کنید</div>
                <form id="authForm">
                    <div class="form-group">
                        <label>نام کاربری</label>
                        <input type="text" id="authUsername" placeholder="نام خود را وارد کنید..." required />
                    </div>
                    <button type="submit" class="btn-full">ورود به چت</button>
                    <div class="error-msg" id="authError"></div>
                </form>
                <div class="auth-switch" style="margin-top:12px;font-size:12px;color:var(--text-secondary);">
                    <i class="fas fa-info-circle"></i>
                    کافیست یک نام انتخاب کنید و وارد شوید
                </div>
            </div>
        </div>

        <!-- ===== HEADER ===== -->
        <header class="header" id="appHeader">
            <span class="brand">📡 چت‌بین‌دستگاهی</span>
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
                <div class="connection-status disconnected" id="connectionStatus">
                    <span class="dot"></span>
                    <span id="statusText">قطع</span>
                </div>
                <div class="user-info">
                    <div class="avatar" id="userAvatar">م</div>
                    <span class="name" id="userName">مهمان</span>
                </div>
                <button class="btn btn-danger" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> خروج
                </button>
            </div>
        </header>

        <!-- ===== DEVICE ID ===== -->
        <div class="device-id-box" id="deviceIdBox">
            <span class="id-label">🆔 شناسه دستگاه شما:</span>
            <span class="id-value" id="deviceIdDisplay">در حال اتصال...</span>
            <button class="copy-btn" id="copyDeviceId">📋 کپی</button>
            <button class="btn btn-primary btn-sm" id="connectToPeerBtn">
                <i class="fas fa-link"></i> اتصال به دستگاه
            </button>
        </div>

        <!-- ===== CHAT ===== -->
        <main class="chat-area" id="chatArea">
            <div class="chat-header">
                <div class="info">
                    <div class="icon">🌐</div>
                    <div>
                        <div class="title">چت جهانی</div>
                        <div class="status online" id="chatStatus">🟢 متصل به همه</div>
                    </div>
                </div>
                <div>
                    <button class="btn btn-sm btn-primary" id="clearChatBtn" style="padding:4px 12px;font-size:11px;">
                        <i class="fas fa-trash-alt"></i> پاک کردن
                    </button>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="empty">
                    <i class="fas fa-wifi"></i>
                    در حال اتصال به شبکه...<br />
                    <span style="font-size:13px;color:var(--text-secondary);">منتظر بمانید تا ارتباط برقرار شود</span>
                </div>
            </div>

            <div class="typing-indicator" id="typingIndicator">
                <span>✏️</span>
                <span id="typingText">در حال تایپ...</span>
                <span class="dots"><span></span><span></span><span></span></span>
            </div>

            <div class="chat-input-area">
                <div class="wrapper">
                    <button class="tool-btn" id="emojiBtn">😊</button>
                    <button class="tool-btn" id="attachBtn">📎</button>
                    <button class="tool-btn record" id="recordBtn">🎤</button>
                    <input type="text" id="chatInput" placeholder="پیام خود را بنویسید..." />
                    <input type="file" id="fileInput" accept="image/*,video/*" style="display:none;" multiple />
                </div>
                <button class="send-btn" id="sendBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ============================================================
        //  ساخته شده توسط هوشمند
        //  چت بین دستگاهی با استفاده از PeerJS (WebRTC)
        //  گوشی + لپ‌تاپ + تبلت = همه با هم!
        // ============================================================

        // ---- STATE ----
        const state = {
            currentUser: null,
            peer: null,
            connections: [], // لیست اتصالات فعال
            messages: JSON.parse(localStorage.getItem('crosschat_messages') || '[]'),
            isRecording: false,
            mediaRecorder: null,
            audioChunks: [],
            myPeerId: null,
            isConnected: false,
        };

        // ---- DOM REFS ----
        const $ = id => document.getElementById(id);
        const authContainer = $('authContainer');
        const authForm = $('authForm');
        const authUsername = $('authUsername');
        const authError = $('authError');
        const appHeader = $('appHeader');
        const chatArea = $('chatArea');
        const chatMessages = $('chatMessages');
        const chatInput = $('chatInput');
        const sendBtn = $('sendBtn');
        const userName = $('userName');
        const userAvatar = $('userAvatar');
        const connectionStatus = $('connectionStatus');
        const statusText = $('statusText');
        const deviceIdDisplay = $('deviceIdDisplay');
        const deviceIdBox = $('deviceIdBox');
        const copyDeviceId = $('copyDeviceId');
        const connectToPeerBtn = $('connectToPeerBtn');
        const typingIndicator = $('typingIndicator');
        const typingText = $('typingText');
        const fileInput = $('fileInput');
        const attachBtn = $('attachBtn');
        const emojiBtn = $('emojiBtn');
        const recordBtn = $('recordBtn');
        const logoutBtn = $('logoutBtn');
        const clearChatBtn = $('clearChatBtn');
        const toastContainer = $('toastContainer');

        let typingTimeout = null;

        // ---- HELPERS ----
        function getTime() {
            const now = new Date();
            return String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function showToast(message, type = 'info') {
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
            el.innerHTML = `${icons[type] || 'ℹ️'} ${message}`;
            toastContainer.appendChild(el);
            setTimeout(() => { el.remove(); }, 3000);
        }

        function saveMessages() {
            localStorage.setItem('crosschat_messages', JSON.stringify(state.messages));
        }

        // ---- PEERJS CONNECTION ----
        function initPeer() {
            // ایجاد Peer با ID تصادفی
            state.peer = new Peer(undefined, {
                debug: 2,
                config: {
                    'iceServers': [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' },
                    ]
                }
            });

            state.peer.on('open', (id) => {
                state.myPeerId = id;
                deviceIdDisplay.textContent = id;
                deviceIdBox.classList.add('active');
                updateConnectionStatus(true);
                showToast(`✅ دستگاه متصل شد! ID: ${id.substring(0, 8)}...`, 'success');
                
                // ارسال پیام سیستم
                addSystemMessage(`🟢 شما با ID ${id.substring(0, 8)}... وارد شدید`);
            });

            // دریافت اتصال از دیگران
            state.peer.on('connection', (conn) => {
                setupConnection(conn);
            });

            state.peer.on('error', (err) => {
                console.error('Peer error:', err);
                if (err.type === 'peer-unavailable') {
                    showToast('❌ دستگاه مورد نظر یافت نشد', 'error');
                }
            });

            state.peer.on('disconnected', () => {
                updateConnectionStatus(false);
                showToast('❌ اتصال قطع شد! در حال تلاش مجدد...', 'error');
                // تلاش برای اتصال مجدد
                setTimeout(() => {
                    state.peer.reconnect();
                }, 3000);
            });
        }

        // ---- SETUP CONNECTION ----
        function setupConnection(conn) {
            const peerId = conn.peer;
            
            // اضافه کردن به لیست اتصالات
            if (!state.connections.find(c => c.peer === peerId)) {
                state.connections.push(conn);
            }

            conn.on('open', () => {
                showToast(`🔗 به ${peerId.substring(0, 8)}... متصل شدید`, 'success');
                addSystemMessage(`🔗 ${peerId.substring(0, 8)}... به جمع پیوست`);
                updateConnectionStatus(true);
            });

            conn.on('data', (data) => {
                handleIncomingData(data, peerId);
            });

            conn.on('close', () => {
                state.connections = state.connections.filter(c => c.peer !== peerId);
                showToast(`🔌 ${peerId.substring(0, 8)}... disconnected`, 'warning');
                addSystemMessage(`🔌 ${peerId.substring(0, 8)}... از جمع خارج شد`);
                if (state.connections.length === 0) {
                    updateConnectionStatus(false);
                }
            });

            conn.on('error', (err) => {
                console.error('Connection error:', err);
            });
        }

        // ---- CONNECT TO PEER ----
        function connectToPeer(peerId) {
            if (!state.peer) {
                showToast('❌ اتصال Peer برقرار نیست', 'error');
                return;
            }
            if (peerId === state.myPeerId) {
                showToast('❌ نمی‌توانید به خودتان متصل شوید!', 'error');
                return;
            }
            if (state.connections.find(c => c.peer === peerId)) {
                showToast('ℹ️ قبلاً به این دستگاه متصل هستید', 'info');
                return;
            }

            showToast(`🔄 در حال اتصال به ${peerId.substring(0, 8)}...`, 'info');
            const conn = state.peer.connect(peerId);
            setupConnection(conn);
        }

        // ---- HANDLE INCOMING DATA ----
        function handleIncomingData(data, fromPeerId) {
            if (data.type === 'message') {
                // پیام جدید از کاربر دیگر
                const msg = data.payload;
                state.messages.push({
                    username: msg.username || 'ناشناس',
                    text: msg.text || '',
                    image: msg.image || null,
                    video: msg.video || null,
                    audio: msg.audio || null,
                    time: msg.time || getTime(),
                    fromPeer: fromPeerId,
                    isOwn: false,
                });
                saveMessages();
                renderMessages();
                showToast(`📩 ${msg.username || 'ناشناس'}: ${msg.text || 'رسانه'}`, 'info');
            }
            
            if (data.type === 'typing') {
                typingIndicator.classList.add('show');
                typingText.textContent = `${data.username} در حال تایپ...`;
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    typingIndicator.classList.remove('show');
                }, 3000);
            }
            
            if (data.type === 'user_joined') {
                addSystemMessage(`👋 ${data.username} به جمع ما پیوست (از دستگاه دیگر)`);
                showToast(`👋 ${data.username} به جمع پیوست!`, 'success');
            }
            
            if (data.type === 'user_left') {
                addSystemMessage(`👋 ${data.username} از جمع خارج شد`);
            }
            
            if (data.type === 'clear_chat') {
                state.messages = [];
                saveMessages();
                renderMessages();
                showToast('🧹 چت توسط کاربر دیگر پاک شد', 'warning');
            }
        }

        // ---- SEND DATA TO ALL ----
        function sendToAll(type, payload) {
            const data = { type, payload };
            state.connections.forEach(conn => {
                try {
                    conn.send(data);
                } catch (e) {
                    console.error('Error sending to peer:', e);
                }
            });
        }

        // ---- UPDATE CONNECTION STATUS ----
        function updateConnectionStatus(connected) {
            state.isConnected = connected;
            if (connected && state.connections.length > 0) {
                connectionStatus.className = 'connection-status connected';
                statusText.textContent = `${state.connections.length} متصل`;
                sendBtn.disabled = false;
            } else if (connected && state.connections.length === 0) {
                connectionStatus.className = 'connection-status disconnected';
                statusText.textContent = 'بدون اتصال';
                sendBtn.disabled = true;
            } else {
                connectionStatus.className = 'connection-status disconnected';
                statusText.textContent = 'قطع';
                sendBtn.disabled = true;
            }
        }

        // ---- AUTH ----
        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = authUsername.value.trim();
            authError.classList.remove('show');
            authError.textContent = '';

            if (!username) {
                authError.textContent = '❌ لطفاً یک نام وارد کنید';
                authError.classList.add('show');
                return;
            }

            state.currentUser = { username };
            localStorage.setItem('crosschat_user', username);
            
            authContainer.classList.remove('active');
            appHeader.classList.add('active');
            chatArea.classList.add('active');
            deviceIdBox.classList.add('active');
            
            userName.textContent = username;
            userAvatar.textContent = username[0].toUpperCase();
            userAvatar.style.background = `linear-gradient(135deg, ${['#3b82f6','#8b5cf6','#ec4899','#f97316','#22d3ee','#10b981','#fbbf24','#ef4444'][Math.floor(Math.random()*8)]}, #1a2332)`;
            
            showToast(`👋 خوش آمدید ${username}!`, 'success');
            
            // راه‌اندازی PeerJS
            initPeer();
            renderMessages();
            
            // اعلام به دیگران
            setTimeout(() => {
                sendToAll('user_joined', { username });
            }, 1000);
        });

        // ---- LOGOUT ----
        logoutBtn.addEventListener('click', () => {
            const username = state.currentUser?.username;
            
            // اطلاع به دیگران
            sendToAll('user_left', { username });
            
            // بستن اتصالات
            state.connections.forEach(conn => conn.close());
            state.connections = [];
            if (state.peer) state.peer.destroy();
            
            state.currentUser = null;
            localStorage.removeItem('crosschat_user');
            
            appHeader.classList.remove('active');
            chatArea.classList.remove('active');
            deviceIdBox.classList.remove('active');
            authContainer.classList.add('active');
            
            authUsername.value = '';
            showToast('👋 شما خارج شدید', 'info');
        });

        // ---- CONNECT TO PEER (با وارد کردن ID) ----
        connectToPeerBtn.addEventListener('click', () => {
            const peerId = prompt('🆔 شناسه دستگاه مقصد را وارد کنید:');
            if (peerId && peerId.trim()) {
                connectToPeer(peerId.trim());
            }
        });

        // ---- COPY DEVICE ID ----
        copyDeviceId.addEventListener('click', () => {
            const id = deviceIdDisplay.textContent;
            if (id && id !== 'در حال اتصال...') {
                navigator.clipboard.writeText(id).then(() => {
                    showToast('📋 شناسه دستگاه کپی شد!', 'success');
                }).catch(() => {
                    // Fallback
                    const textarea = document.createElement('textarea');
                    textarea.value = id;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    textarea.remove();
                    showToast('📋 شناسه دستگاه کپی شد!', 'success');
                });
            }
        });

        // ---- MESSAGES ----
        function renderMessages() {
            chatMessages.innerHTML = '';
            
            if (state.messages.length === 0) {
                chatMessages.innerHTML = `
                    <div class="empty">
                        <i class="fas fa-wifi"></i>
                        منتظر پیام‌ها باشید...<br />
                        <span style="font-size:13px;color:var(--text-secondary);">ID دستگاه خود را با دوستان به اشتراک بگذارید</span>
                    </div>
                `;
                return;
            }

            state.messages.forEach((msg) => {
                const div = document.createElement('div');
                const isOwn = msg.username === state.currentUser?.username;
                
                if (msg.username === 'سیستم') {
                    div.className = 'message system';
                    div.textContent = msg.text;
                } else {
                    div.className = `message ${isOwn ? 'own' : 'other'}`;
                    
                    let content = '';
                    if (!isOwn) {
                        content += `<span class="msg-user">${msg.username}</span>`;
                    }
                    
                    if (msg.text) content += msg.text;
                    
                    if (msg.image) {
                        content += `<div class="msg-media"><img src="${msg.image}" alt="تصویر" onclick="window.open('${msg.image}','_blank')" /></div>`;
                    }
                    if (msg.video) {
                        content += `<div class="msg-media"><video controls src="${msg.video}"></video></div>`;
                    }
                    if (msg.audio) {
                        content += `<div class="msg-audio"><audio controls src="${msg.audio}"></audio></div>`;
                    }
                    
                    content += ` <span class="msg-time">${msg.time}</span>`;
                    if (isOwn) content += ` <span class="msg-seen">✓✓</span>`;
                    
                    div.innerHTML = content;
                }
                
                chatMessages.appendChild(div);
            });
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addMessage(text, type = 'text', mediaData = null) {
            if (!state.currentUser) return;
            
            const msg = {
                username: state.currentUser.username,
                text: text || '',
                time: getTime(),
                isOwn: true,
            };

            if (type === 'image' && mediaData) msg.image = mediaData;
            else if (type === 'video' && mediaData) msg.video = mediaData;
            else if (type === 'audio' && mediaData) msg.audio = mediaData;

            state.messages.push(msg);
            saveMessages();
            renderMessages();
            
            // ارسال به همه دستگاه‌های متصل
            sendToAll('message', msg);
        }

        function addSystemMessage(text) {
            const msg = {
                username: 'سیستم',
                text: text,
                time: getTime(),
                isOwn: false,
            };
            state.messages.push(msg);
            saveMessages();
            renderMessages();
            sendToAll('message', msg);
        }

        // ---- SEND ----
        function sendMessage() {
            const text = chatInput.value.trim();
            if (text) {
                addMessage(text);
                chatInput.value = '';
            }
            typingIndicator.classList.remove('show');
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // ---- TYPING ----
        chatInput.addEventListener('input', () => {
            if (chatInput.value.trim()) {
                sendToAll('typing', { username: state.currentUser?.username });
            }
        });

        // ---- EMOJI ----
        const emojis = ['😊', '😂', '❤️', '🔥', '🎯', '👍', '👏', '💪', '🎉', '✨', '🌟', '😍', '🥰', '😘', '🤩', '🙌', '👀', '💯', '⚡', '🎵', '🎶', '💬', '💭'];
        emojiBtn.addEventListener('click', () => {
            chatInput.value += emojis[Math.floor(Math.random() * emojis.length)];
            chatInput.focus();
        });

        // ---- ATTACH ----
        attachBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (!files.length) return;

            for (const file of files) {
                if (file.size > 20 * 1024 * 1024) {
                    showToast('❌ حجم فایل نباید بیشتر از ۲۰ مگابایت باشد', 'error');
                    continue;
                }

                const reader = new FileReader();
                reader.onload = (event) => {
                    const data = event.target.result;
                    if (file.type.startsWith('image/')) {
                        addMessage('📷 تصویر', 'image', data);
                        showToast('📷 تصویر ارسال شد', 'success');
                    } else if (file.type.startsWith('video/')) {
                        addMessage('🎬 ویدیو', 'video', data);
                        showToast('🎬 ویدیو ارسال شد', 'success');
                    }
                };
                reader.readAsDataURL(file);
            }
            fileInput.value = '';
        });

        // ---- VOICE ----
        recordBtn.addEventListener('click', async () => {
            if (state.isRecording) {
                if (state.mediaRecorder && state.mediaRecorder.state === 'recording') {
                    state.mediaRecorder.stop();
                }
                state.isRecording = false;
                recordBtn.classList.remove('recording');
                recordBtn.innerHTML = '🎤';
                showToast('⏹ ضبط متوقف شد', 'info');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                state.mediaRecorder = new MediaRecorder(stream);
                state.audioChunks = [];

                state.mediaRecorder.ondataavailable = (event) => {
                    state.audioChunks.push(event.data);
                };

                state.mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(state.audioChunks, { type: 'audio/wav' });
                    const reader = new FileReader();
                    reader.onload = () => {
                        addMessage('🎤 ویسی مسیج', 'audio', reader.result);
                        showToast('🎤 ویسی مسیج ارسال شد', 'success');
                    };
                    reader.readAsDataURL(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };

                state.mediaRecorder.start();
                state.isRecording = true;
                recordBtn.classList.add('recording');
                recordBtn.innerHTML = '⏹';
                showToast('🎤 در حال ضبط... کلیک کنید تا متوقف شود', 'warning');
            } catch (err) {
                showToast('❌ دسترسی به میکروفون امکان‌پذیر نیست', 'error');
                console.error(err);
            }
        });

        // ---- CLEAR CHAT ----
        clearChatBtn.addEventListener('click', () => {
            if (confirm('آیا مطمئن هستید؟ تمام پیام‌ها پاک می‌شوند.')) {
                state.messages = [];
                saveMessages();
                renderMessages();
                sendToAll('clear_chat', {});
                showToast('🧹 چت پاک شد', 'warning');
            }
        });

        // ---- INIT ----
        function init() {
            const savedUser = localStorage.getItem('crosschat_user');
            if (savedUser) {
                authUsername.value = savedUser;
                authForm.dispatchEvent(new Event('submit'));
            }
        }

        // ---- DRAG & DROP ----
        document.addEventListener('dragover', (e) => e.preventDefault());
        document.addEventListener('drop', (e) => {
            e.preventDefault();
            const files = e.dataTransfer.files;
            if (files.length) {
                fileInput.files = files;
                fileInput.dispatchEvent(new Event('change'));
            }
        });

        init();
        console.log('✅ ساخته شده توسط هوشمند');
        console.log('📡 چت بین دستگاهی با WebRTC (PeerJS)');
        console.log('💡 گوشی + لپ‌تاپ + تبلت = همه با هم!');
    </script>
</body>
</html>
