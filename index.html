<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدیریت آقای عرفان بالایی | برنامه‌ریز درسی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#06080c;--p:#0d1118;--p2:#141a25;--ln:#283042;--gold:#d8b45f;--gold2:#f3dc9e;--tx:#ebe7da;--mu:#8a93a5;--ok:#5fd6a0;--bad:#e5645a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Vazirmatn',Tahoma,sans-serif;line-height:1.8;min-height:100vh}
#rain{position:fixed;inset:0;width:100%;height:100%;opacity:.16;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:16px}
.brand{text-align:center;padding:26px 10px 14px;border-bottom:1px solid var(--ln);margin-bottom:18px}
.term{font-family:ui-monospace,Consolas,monospace;color:var(--ok);font-size:.8rem;direction:ltr;min-height:1.4em}
.term:after{content:"▌";animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
h1{margin:6px 0 0;font-weight:800;font-size:clamp(1.5rem,5vw,2.6rem);background:linear-gradient(100deg,#9c7a2c,var(--gold2) 45%,var(--gold) 70%,#9c7a2c);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px;text-shadow:0 0 30px #d8b45f22}
.sub{color:var(--mu);font-weight:300;margin:0}
.card{background:linear-gradient(160deg,var(--p2),var(--p));border:1px solid var(--ln);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 10px 40px #0008,inset 0 1px 0 #ffffff0a}
.card h3{margin:0 0 10px;color:var(--gold2);font-weight:500;font-size:1.05rem}
.auth{max-width:420px;margin:0 auto}
input,select,textarea,button{font-family:inherit;font-size:.95rem}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--ln);color:var(--tx);padding:10px 12px;border-radius:9px;margin:5px 0 10px;outline:none}
input:focus,select:focus,textarea:focus,button:focus-visible{border-color:var(--gold);box-shadow:0 0 0 2px #d8b45f44}
label{font-size:.85rem;color:var(--mu)}
.btn{background:linear-gradient(135deg,#f3dc9e,#c79d3f);color:#171002;border:0;padding:10px 18px;border-radius:9px;font-weight:800;cursor:pointer}
.btn.g{background:transparent;color:var(--gold2);border:1px solid var(--gold)}
.btn.s{padding:4px 10px;font-size:.8rem}.btn.r{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}.row>.btn{flex:0 0 auto}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.tabs button{flex:0 0 auto;background:var(--p);color:var(--mu);border:1px solid var(--ln);padding:8px 16px;border-radius:30px;cursor:pointer}
.tabs button.on{color:#171002;background:var(--gold);border-color:var(--gold);font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpi{text-align:center}.kpi b{display:block;font-size:2rem;color:var(--gold2);font-weight:800}.kpi span{color:var(--mu);font-size:.85rem}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:.85rem}.bar i{display:block;height:10px;border-radius:6px;background:linear-gradient(90deg,#8a6a22,var(--gold2))}.bar div{flex:1;background:var(--bg);border-radius:6px}.bar span:first-child{width:96px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--ln);padding:5px 12px;border-radius:30px;cursor:pointer;background:var(--p);color:var(--tx)}.chip.on{border-color:var(--gold);background:#d8b45f22;color:var(--gold2)}
.it{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--ln)}.it:last-child{border:0}.it input[type=checkbox]{width:auto;margin:0;accent-color:var(--gold)}.it .g1{flex:1}
.it.dn .g1{text-decoration:line-through;color:var(--mu)}
.day{border:1px solid var(--ln);border-radius:12px;padding:12px;background:var(--p)}.day.today{border-color:var(--gold);box-shadow:0 0 18px #d8b45f2a}
.big{font-size:3.4rem;text-align:center;font-weight:800;color:var(--gold2);font-variant-numeric:tabular-nums;direction:ltr}
.mu{color:var(--mu);font-size:.85rem}.ok{color:var(--ok)}.bad{color:var(--bad)}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--gold);color:#171002;padding:9px 18px;border-radius:30px;font-weight:800;opacity:0;transition:.3s;z-index:9;pointer-events:none}
#toast.show{opacity:1}
[data-th=light]{--bg:#f6f1e6;--p:#fffdf8;--p2:#f1eadb;--ln:#d9ccb0;--gold:#a67c1e;--gold2:#6d4f0f;--tx:#2a2418;--mu:#6f6652;--ok:#1f8f5f;--bad:#c0392b;color-scheme:light}
[data-th=light] h1{background:linear-gradient(100deg,#6d4f0f,#b48a2c 50%,#6d4f0f);-webkit-background-clip:text;background-clip:text}
[data-th=light] #rain{display:none}
[data-th=light] .card{box-shadow:0 8px 24px #6d4f0f18}
#thb{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:5}
.cht{display:flex;gap:8px;align-items:flex-end;height:130px}.cht>div{flex:1;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;height:100%}.cht i{display:block;min-height:3px;border-radius:6px 6px 0 0;background:linear-gradient(0deg,#8a6a22,var(--gold2))}
.tip{border-right:3px solid var(--gold);padding:4px 12px;margin:0 0 14px;color:var(--tx)}
@media (prefers-reduced-motion:reduce){.term:after{animation:none}}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<button id="thb" class="btn g s" onclick="thm()" aria-label="تغییر پوسته">☀</button>
<div class="wrap">
  <header class="brand">
    <div class="term" id="term"></div>
    <h1>مدیریت آقای عرفان بالایی</h1>
    <p class="sub">سامانه هوشمند برنامه‌ریزی و مدیریت مطالعه</p>
  </header>
  <main id="app"></main>
</div>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),fa=n=>Number(n).toLocaleString('fa-IR',{maximumFractionDigits:2});
const P={e:['ریاضی','فارسی','علوم','مطالعات اجتماعی','قرآن','هدیه‌های آسمان','املا','هنر'],m:['ریاضی','علوم','فارسی','عربی','انگلیسی','مطالعات اجتماعی','دین و زندگی','قرآن'],h:['ریاضی','فیزیک','شیمی','زیست‌شناسی','ادبیات فارسی','عربی','دین و زندگی','زبان انگلیسی','زمین‌شناسی','هندسه']};
const DAYS=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const Q=['هر روز کمی، بهتر از یک شب زیاد.','تمرکز ۲۵ دقیقه‌ای، نتیجه‌ی یک ساعت.','درس سخت را اول بخوان، سبک‌ها را آخر.','خواب کافی هم بخشی از برنامه‌ی درسی است.'];
let U=null,S=null,tab='dash',setup=null,tm={left:1500,run:false,mode:'work',id:null,sub:''};
const ST={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('ذخیره‌سازی مرورگر در دسترس نیست')}}};
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function hs(p,s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const sv=()=>ST.set('ev_d_'+U,S);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const tIdx=()=>(new Date().getDay()+1)%7;

/* ---------- auth ---------- */
function authView(reg){
  $('#app').innerHTML=`<div class="card auth"><h3>${reg?'ثبت‌نام':'ورود به حساب'}</h3>
  <label>نام کاربری</label><input id="un" autocomplete="username" autocapitalize="none">
  <label>رمز عبور</label><input id="pw" type="password" autocomplete="${reg?'new-password':'current-password'}">
  ${reg?'<label>تکرار رمز عبور</label><input id="pw2" type="password" autocomplete="new-password">':''}
  <div class="row"><button class="btn" onclick="${reg?'doReg()':'doLogin()'}">${reg?'ساخت حساب':'ورود'}</button>
  <button class="btn g" onclick="authView(${!reg})">${reg?'حساب دارم':'ثبت‌نام'}</button></div>
  <p class="mu">اطلاعات روی همین مرورگر ذخیره می‌شود. برای نگهداری در گوگل، از بخش «پشتیبان» استفاده کن.</p></div>`;
}
async function doReg(){
  const n=$('#un').value.trim().toLowerCase(),p=$('#pw').value;
  if(n.length<3)return toast('نام کاربری حداقل ۳ حرف');
  if(p.length<6)return toast('رمز حداقل ۶ کاراکتر');
  if(p!==$('#pw2').value)return toast('رمزها یکی نیستند');
  const us=ST.get('ev_users')||{};
  if(us[n])return toast('این نام کاربری گرفته شده');
  const s=crypto.getRandomValues(new Uint32Array(2)).join('-');
  us[n]={s,h:await hs(p,s)};ST.set('ev_users',us);
  enter(n);
}
async function doLogin(){
  const n=$('#un').value.trim().toLowerCase(),p=$('#pw').value,us=ST.get('ev_users')||{};
  if(!us[n]||us[n].h!==await hs(p,us[n].s))return toast('نام کاربری یا رمز اشتباه است');
  enter(n);
}
function enter(n){
  U=n;try{sessionStorage.setItem('ev_cur',n)}catch(e){}
  S=ST.get('ev_d_'+n);
  if(!S){S={grade:0,subjects:[],hours:3,plan:[],done:{},log:[],tasks:[],exams:[]};setup={step:1}}
  render();
}
function logout(){U=S=null;try{sessionStorage.removeItem('ev_cur')}catch(e){}authView(false)}

/* ---------- setup ---------- */
function setupView(){
  if(setup.step===1){
    const g=setup.grade||S.grade||7,band=g<=6?'e':g<=9?'m':'h',list=P[band];
    setup.sel=setup.sel||(S.subjects.map(x=>x.n));
    $('#app').innerHTML=`<div class="card"><h3>مرحله ۱ از ۲ — پایه و درس‌ها</h3>
    <label>کلاس چندمی؟</label><select id="gr" onchange="setup.grade=+this.value;setup.sel=[];setupView()">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${i+1===g?'selected':''}>پایه ${fa(i+1)}</option>`).join('')}</select>
    <label>درس‌هایت را انتخاب کن</label><div class="chips" id="ch">${list.concat(setup.sel.filter(x=>!list.includes(x))).map(x=>`<span class="chip ${setup.sel.includes(x)?'on':''}" onclick="tg(this)">${esc(x)}</span>`).join('')}</div>
    <div class="row" style="margin-top:12px"><input id="cu" placeholder="درس دلخواه اضافه کن"><button class="btn g" onclick="addCu()">افزودن</button></div>
    <label>ساعت مطالعه‌ی روزانه</label><input id="hr" type="number" min="1" max="12" step="0.5" value="${S.hours}">
    <button class="btn" onclick="toStep2()">مرحله بعد</button></div>`;
  }else{
    $('#app').innerHTML=`<div class="card"><h3>مرحله ۲ از ۲ — نمره‌ها</h3><p class="mu">آخرین نمره‌ی هر درس را از ۲۰ وارد کن. برنامه، وقت بیشتری به درس‌های ضعیف‌تر می‌دهد.</p>
    ${setup.sel.map((n,i)=>{const o=S.subjects.find(x=>x.n===n);return`<label>${esc(n)}</label><input type="number" min="0" max="20" step="0.25" data-s="${i}" value="${o&&o.scores.length?o.scores[o.scores.length-1]:''}">`}).join('')}
    <div class="row"><button class="btn g" onclick="setup.step=1;setupView()">بازگشت</button><button class="btn" onclick="finish()">ساخت برنامه</button></div></div>`;
  }
}
function tg(e){e.classList.toggle('on');setup.sel=[...document.querySelectorAll('#ch .chip.on')].map(x=>x.textContent)}
function addCu(){const v=$('#cu').value.trim();if(!v)return;setup.sel=[...document.querySelectorAll('#ch .chip.on')].map(x=>x.textContent);if(!setup.sel.includes(v))setup.sel.push(v);S.hours=+$('#hr').value||3;setupView()}
function toStep2(){
  setup.sel=[...document.querySelectorAll('#ch .chip.on')].map(x=>x.textContent);
  if(!setup.sel.length)return toast('حداقل یک درس انتخاب کن');
  S.grade=+$('#gr').value;S.hours=Math.min(12,Math.max(1,+$('#hr').value||3));setup.step=2;setupView();
}
function finish(){
  const old=S.subjects,ns=[];
  setup.sel.forEach((n,i)=>{const v=parseFloat(document.querySelector(`[data-s="${i}"]`).value),o=old.find(x=>x.n===n)||{n,scores:[]};
    if(!isNaN(v)&&v>=0&&v<=20){if(!o.scores.length||o.scores[o.scores.length-1]!==v)o.scores.push(v)}ns.push(o)});
  S.subjects=ns;gen();setup=null;tab='dash';sv();render();toast('برنامه ساخته شد');
}

/* ---------- planner ---------- */
const avgOf=o=>o.scores.length?o.scores.reduce((a,b)=>a+b,0)/o.scores.length:null;
const last=o=>o.scores.length?o.scores[o.scores.length-1]:12;
function gen(){
  const total=Math.round(S.hours*60*6/45),w=S.subjects.map(o=>Math.max(2,22-last(o))),W=w.reduce((a,b)=>a+b,0)||1;
  let cnt=w.map(x=>Math.max(1,Math.round(total*x/W)));
  const q=[];let more=true;
  while(more){more=false;S.subjects.forEach((o,i)=>{if(cnt[i]>0){q.push(o.n);cnt[i]--;more=true}})}
  const plan=DAYS.map(()=>[]);
  q.forEach((n,i)=>{let d=i%7;for(let k=0;k<7;k++){const dd=(d+k)%7;if(!plan[dd].some(x=>x.sub===n)){d=dd;break}}plan[d].push({sub:n,min:45})});
  plan[6]=plan[6].slice(0,2);
  S.plan=plan;S.done={};
}
function setDone(k,d,i){
  const sub=S.plan[d][i].sub,key='pl'+k;
  if(S.done[k]){delete S.done[k];S.log=S.log.filter(x=>x.k!==key)}
  else{S.done[k]=1;S.log.push({k:key,d:today(),sub,min:S.plan[d][i].min})}
  sv();render();
}
function streak(){
  const ds=new Set(S.log.map(x=>x.d));let n=0,d=new Date();
  if(!ds.has(today()))d.setDate(d.getDate()-1);
  for(;;){const k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');if(ds.has(k)){n++;d.setDate(d.getDate()-1)}else break}
  return n;
}
function weekMin(){const c=new Date();c.setDate(c.getDate()-6);const s=c.getFullYear()+'-'+String(c.getMonth()+1).padStart(2,'0')+'-'+String(c.getDate()).padStart(2,'0');return S.log.filter(x=>x.d>=s).reduce((a,b)=>a+b.min,0)}
function gpa(){const a=S.subjects.map(avgOf).filter(x=>x!==null);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}

/* ---------- views ---------- */
function render(){
  clearInterval(tm.id);tm.id=null;tm.run=false;
  if(!U)return authView(false);
  if(setup)return setupView();
  const T=[['dash','داشبورد'],['plan','برنامه هفتگی'],['grades','نمرات'],['timer','تایمر تمرکز'],['todo','تکالیف و امتحان'],['set','تنظیمات و پشتیبان']];
  $('#app').innerHTML=`<div class="row" style="margin-bottom:10px"><span class="mu">کاربر: ${esc(U)} — پایه ${fa(S.grade)}</span><button class="btn g s" style="flex:0" onclick="logout()">خروج</button></div>
  <nav class="tabs">${T.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</nav><section id="v"></section>`;
  ({dash,plan,grades,timer,todo,set})[tab]();
}
function dash(){
  const g=gpa(),sw=[...S.subjects].sort((a,b)=>last(a)-last(b))[0],t=tIdx(),pl=S.plan[t]||[],dn=pl.filter((_,i)=>S.done[t+'_'+i]).length;
  const ex=S.exams.filter(e=>e.d>=today()).sort((a,b)=>a.d<b.d?-1:1)[0];
  const dl=ex?Math.ceil((new Date(ex.d+'T00:00')-new Date(today()+'T00:00'))/864e5):null;
  $('#v').innerHTML=`<div class="grid">
  <div class="card kpi"><b>${g===null?'—':fa(g)}</b><span>معدل کل از ۲۰</span></div>
  <div class="card kpi"><b>${fa(streak())}</b><span>روز پشت‌سرهم مطالعه</span></div>
  <div class="card kpi"><b>${fa(Math.round(weekMin()/60*10)/10)}</b><span>ساعت مطالعه در ۷ روز اخیر</span></div>
  <div class="card kpi"><b>${dl===null?'—':fa(dl)}</b><span>${ex?'روز تا '+esc(ex.n):'امتحانی ثبت نشده'}</span></div></div>
  <div class="grid"><div class="card"><h3>برنامه‌ی امروز (${DAYS[t]})</h3>
  ${pl.length?pl.map((p,i)=>`<div class="it ${S.done[t+'_'+i]?'dn':''}"><input type="checkbox" ${S.done[t+'_'+i]?'checked':''} onchange="setDone('${t}_${i}',${t},${i})"><span class="g1">${esc(p.sub)}</span><span class="mu">${fa(p.min)} دقیقه</span></div>`).join(''):'<p class="mu">برای امروز چیزی نیست.</p>'}
  <p class="mu">${fa(dn)} از ${fa(pl.length)} انجام شد</p></div>
  <div class="card"><h3>میانگین هر درس</h3>${S.subjects.map(o=>{const a=avgOf(o);return`<div class="bar"><span>${esc(o.n)}</span><div><i style="width:${a===null?0:a*5}%"></i></div><span>${a===null?'—':fa(a)}</span></div>`}).join('')}
  ${sw&&S.subjects.some(o=>o.scores.length)?`<p class="mu">بیشترین وقت برنامه برای «${esc(sw.n)}» است چون نمره‌اش پایین‌تر است.</p>`:''}</div></div>
  <p class="mu" style="text-align:center">${Q[new Date().getDate()%Q.length]}</p>`;
}
function plan(){
  const t=tIdx();
  $('#v').innerHTML=`<div class="row" style="margin-bottom:10px"><span class="mu">هر جلسه ۴۵ دقیقه. درس‌های ضعیف‌تر جلسه‌ی بیشتری دارند.</span><button class="btn g" onclick="if(confirm('برنامه‌ی جدید جایگزین فعلی می‌شود. ادامه؟')){gen();sv();render()}">ساخت دوباره</button></div>
  <div class="grid">${S.plan.map((d,di)=>`<div class="day ${di===t?'today':''}"><b>${DAYS[di]}</b>${d.length?d.map((p,i)=>`<div class="it ${S.done[di+'_'+i]?'dn':''}"><input type="checkbox" ${S.done[di+'_'+i]?'checked':''} onchange="setDone('${di}_${i}',${di},${i})"><span class="g1">${esc(p.sub)}</span></div>`).join(''):'<p class="mu">استراحت</p>'}</div>`).join('')}</div>`;
}
function grades(){
  $('#v').innerHTML=`<div class="card"><h3>ثبت نمره‌ی جدید</h3><div class="row"><select id="gs">${S.subjects.map((o,i)=>`<option value="${i}">${esc(o.n)}</option>`).join('')}</select><input id="gv" type="number" min="0" max="20" step="0.25" placeholder="نمره از ۲۰"><button class="btn" onclick="addG()">ثبت</button></div></div>
  ${S.subjects.map((o,i)=>`<div class="card"><div class="row"><b>${esc(o.n)}</b><span class="mu">میانگین: ${avgOf(o)===null?'—':fa(avgOf(o))}</span></div>
  <div class="chips" style="margin-top:6px">${o.scores.map((s,j)=>`<span class="chip" title="حذف" onclick="delG(${i},${j})">${fa(s)} ✕</span>`).join('')||'<span class="mu">نمره‌ای نیست</span>'}</div></div>`).join('')}`;
}
function addG(){const v=parseFloat($('#gv').value);if(isNaN(v)||v<0||v>20)return toast('نمره باید بین ۰ تا ۲۰ باشد');S.subjects[+$('#gs').value].scores.push(v);sv();render();toast('ثبت شد')}
function delG(i,j){S.subjects[i].scores.splice(j,1);sv();render()}
function timer(){
  const m=Math.floor(tm.left/60),s=tm.left%60;
  $('#v').innerHTML=`<div class="card" style="text-align:center"><h3>${tm.mode==='work'?'زمان تمرکز':'زمان استراحت'}</h3>
  <div class="big" id="tt">${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</div>
  <select id="ts" style="max-width:260px">${S.subjects.map(o=>`<option ${o.n===tm.sub?'selected':''}>${esc(o.n)}</option>`).join('')}</select>
  <div class="row" style="justify-content:center"><button class="btn" onclick="tgT()">شروع / توقف</button><button class="btn g" onclick="rsT()">بازنشانی</button></div>
  <p class="mu">۲۵ دقیقه مطالعه، ۵ دقیقه استراحت. هر دوره‌ی کامل در گزارش مطالعه ثبت می‌شود.</p></div>`;
}
function tgT(){
  if(tm.run){clearInterval(tm.id);tm.run=false;return}
  tm.sub=$('#ts').value;tm.run=true;
  tm.id=setInterval(()=>{tm.left--;
    if(tm.left<=0){
      if(tm.mode==='work'){S.log.push({k:'t'+Date.now(),d:today(),sub:tm.sub,min:25});sv();tm.mode='rest';tm.left=300;toast('آفرین! یک دوره ثبت شد')}
      else{tm.mode='work';tm.left=1500}
      clearInterval(tm.id);tm.run=false;timer();return}
    const e=$('#tt');if(e)e.textContent=String(Math.floor(tm.left/60)).padStart(2,'0')+':'+String(tm.left%60).padStart(2,'0')},1000);
}
function rsT(){clearInterval(tm.id);tm.run=false;tm.mode='work';tm.left=1500;timer()}
function todo(){
  const ex=[...S.exams].sort((a,b)=>a.d<b.d?-1:1);
  $('#v').innerHTML=`<div class="grid"><div class="card"><h3>تکالیف</h3>
  <div class="row"><input id="tn" placeholder="تکلیف چیست؟"><input id="td" type="date"></div><button class="btn" onclick="addT()">افزودن</button>
  ${S.tasks.map((t,i)=>`<div class="it ${t.x?'dn':''}"><input type="checkbox" ${t.x?'checked':''} onchange="S.tasks[${i}].x=!S.tasks[${i}].x;sv();render()"><span class="g1">${esc(t.n)}</span><span class="mu">${t.d?new Date(t.d+'T00:00').toLocaleDateString('fa-IR'):''}</span><button class="btn r s" onclick="S.tasks.splice(${i},1);sv();render()">حذف</button></div>`).join('')}</div>
  <div class="card"><h3>امتحان‌ها</h3><div class="row"><input id="en" placeholder="نام امتحان"><input id="ed" type="date"></div><button class="btn" onclick="addE()">افزودن</button>
  ${ex.map(e=>{const d=Math.ceil((new Date(e.d+'T00:00')-new Date(today()+'T00:00'))/864e5);return`<div class="it"><span class="g1">${esc(e.n)}</span><span class="${d<0?'mu':d<=3?'bad':'ok'}">${d<0?'گذشته':fa(d)+' روز'}</span><button class="btn r s" onclick="S.exams.splice(S.exams.indexOf(S.exams.find(z=>z.n==='${esc(e.n).replace(/'/g,'')}'&&z.d==='${e.d}')),1);sv();render()">حذف</button></div>`}).join('')}</div></div>`;
}
function addT(){const n=$('#tn').value.trim();if(!n)return;S.tasks.push({n,d:$('#td').value,x:false});sv();render()}
function addE(){const n=$('#en').value.trim(),d=$('#ed').value;if(!n||!d)return toast('نام و تاریخ لازم است');S.exams.push({n,d});sv();render()}
function set(){
  $('#v').innerHTML=`<div class="grid"><div class="card"><h3>ویرایش پایه و درس‌ها</h3><p class="mu">پایه، درس‌ها و ساعت مطالعه را عوض کن و برنامه از نو ساخته می‌شود.</p><button class="btn" onclick="setup={step:1};render()">ویرایش</button></div>
  <div class="card"><h3>پشتیبان (گوگل)</h3><p class="mu">کد زیر را کپی کن و در Google Keep یا Google Docs یا ایمیل خودت ذخیره کن. هر زمان خواستی همین‌جا بچسبان تا اطلاعات برگردد.</p>
  <textarea id="bk" rows="5" placeholder="کد پشتیبان"></textarea>
  <div class="row"><button class="btn" onclick="exp()">کپی کد پشتیبان</button><button class="btn g" onclick="imp()">بازگردانی</button></div></div>
  <div class="card"><h3>حذف همه‌ی داده‌ها</h3><button class="btn r" onclick="if(confirm('همه‌ی نمره‌ها و برنامه‌ها پاک می‌شود. مطمئنی؟')){S={grade:0,subjects:[],hours:3,plan:[],done:{},log:[],tasks:[],exams:[]};sv();setup={step:1};render()}">پاک‌سازی</button></div></div>`;
}
function exp(){const t=btoa(unescape(encodeURIComponent(JSON.stringify(S))));$('#bk').value=t;$('#bk').select();try{navigator.clipboard.writeText(t).then(()=>toast('کپی شد'),()=>toast('کد را دستی کپی کن'))}catch(e){toast('کد را دستی کپی کن')}}
function imp(){try{const o=JSON.parse(decodeURIComponent(escape(atob($('#bk').value.trim()))));if(!o.subjects||!o.plan)throw 0;S=o;sv();toast('بازگردانی شد');render()}catch(e){toast('کد پشتیبان معتبر نیست')}}

/* ---------- visuals ---------- */
(function(){
  const L=['> initializing secure session...','> loading study engine...','> access granted'],e=$('#term');let i=0,j=0;
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){e.textContent=L[2];return}
  (function t(){if(i>=L.length)return;e.textContent=L[i].slice(0,++j);if(j>=L[i].length){i++;j=0;setTimeout(t,i<L.length?500:0)}else setTimeout(t,28)})();
})();
(function(){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const c=$('#rain'),x=c.getContext('2d');let cols,ys;
  function rs(){c.width=innerWidth;c.height=innerHeight;cols=Math.floor(c.width/18);ys=Array.from({length:cols},()=>Math.random()*c.height/16)}
  rs();addEventListener('resize',rs);
  setInterval(()=>{x.fillStyle='rgba(6,8,12,.12)';x.fillRect(0,0,c.width,c.height);x.font='14px monospace';
    for(let i=0;i<cols;i++){x.fillStyle=i%5?'#d8b45f':'#5fd6a0';x.fillText(Math.random()<.5?'0':'1',i*18,ys[i]*16);ys[i]=ys[i]*16>c.height&&Math.random()>.975?0:ys[i]+1}},70);
})();

/* ---------- boot ---------- */
(function(){let n=null;try{n=sessionStorage.getItem('ev_cur')}catch(e){}if(n&&(ST.get('ev_users')||{})[n])enter(n);else authView(false)})();
</script>
<script>
/* ---------- v2: theme, chart, targets, persistent timer ---------- */
(function(){const t=ST.get('ev_th');if(t==='light'||t==='dark')document.documentElement.dataset.th=t;$('#thb').textContent=t==='light'?'☾':'☀'})();
function thm(){const l=document.documentElement.dataset.th==='light'?'dark':'light';document.documentElement.dataset.th=l;ST.set('ev_th',l);$('#thb').textContent=l==='light'?'☾':'☀'}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
tm.w=tm.w||1500;
function render(){
  if(!U)return authView(false);
  if(setup)return setupView();
  const T=[['dash','داشبورد'],['plan','برنامه هفتگی'],['grades','نمرات'],['timer','تایمر تمرکز'],['todo','تکالیف و امتحان'],['set','تنظیمات و پشتیبان']];
  $('#app').innerHTML=`<div class="row" style="margin-bottom:10px"><span class="mu">کاربر: ${esc(U)} — پایه ${fa(S.grade)}</span><button class="btn g s" style="flex:0" onclick="logout()">خروج</button></div><nav class="tabs">${T.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</nav><section id="v"></section>`;
  ({dash,plan,grades,timer,todo,set})[tab]();
}
function days7(){const r=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const k=key(d);r.push({l:DAYS[(d.getDay()+1)%7],m:S.log.filter(x=>x.d===k).reduce((a,b)=>a+b.min,0)})}return r}
function tip(){
  if(!S.subjects.length)return'';
  const c=new Date();c.setDate(c.getDate()-6);const s=key(c),st={};S.log.filter(x=>x.d>=s).forEach(x=>st[x.sub]=(st[x.sub]||0)+x.min);
  const b=[...S.subjects].sort((a,b)=>((22-last(b))*10-(st[b.n]||0))-((22-last(a))*10-(st[a.n]||0)))[0];
  return`<p class="tip">پیشنهاد امروز: روی «${esc(b.n)}» کار کن. در ۷ روز اخیر ${fa(st[b.n]||0)} دقیقه رویش وقت گذاشته‌ای.</p>`;
}
function dash(){
  const g=gpa(),t=tIdx(),pl=S.plan[t]||[],dn=pl.filter((_,i)=>S.done[t+'_'+i]).length,D=days7(),mx=Math.max(S.hours*60,...D.map(x=>x.m),1),tm0=D[6].m;
  const ex=S.exams.filter(e=>e.d>=today()).sort((a,b)=>a.d<b.d?-1:1)[0];
  const dl=ex?Math.ceil((new Date(ex.d+'T00:00')-new Date(today()+'T00:00'))/864e5):null;
  $('#v').innerHTML=`${tip()}<div class="grid">
  <div class="card kpi"><b>${g===null?'—':fa(g)}</b><span>معدل کل از ۲۰</span></div>
  <div class="card kpi"><b>${fa(streak())}</b><span>روز پشت‌سرهم مطالعه</span></div>
  <div class="card kpi"><b>${fa(tm0)}</b><span>دقیقه امروز از هدف ${fa(Math.round(S.hours*60))}</span></div>
  <div class="card kpi"><b>${dl===null?'—':fa(dl)}</b><span>${ex?'روز تا '+esc(ex.n):'امتحانی ثبت نشده'}</span></div></div>
  <div class="grid"><div class="card"><h3>برنامه‌ی امروز (${DAYS[t]})</h3>
  ${pl.length?pl.map((p,i)=>`<div class="it ${S.done[t+'_'+i]?'dn':''}"><input type="checkbox" ${S.done[t+'_'+i]?'checked':''} onchange="setDone('${t}_${i}',${t},${i})"><span class="g1">${esc(p.sub)}</span><span class="mu">${fa(p.min)} دقیقه</span></div>`).join(''):'<p class="mu">برای امروز چیزی نیست.</p>'}
  <p class="mu">${fa(dn)} از ${fa(pl.length)} انجام شد</p></div>
  <div class="card"><h3>مطالعه‌ی ۷ روز اخیر (دقیقه)</h3><div class="cht">${D.map(x=>`<div title="${fa(x.m)} دقیقه"><i style="height:${Math.round(x.m/mx*90)}px"></i><span class="mu">${x.l.slice(0,2)}</span></div>`).join('')}</div></div></div>`;
}
function spark(a){if(a.length<2)return'';const w=160,h=36,p=a.map((v,i)=>(i*(w/(a.length-1))).toFixed(1)+','+(h-v/20*h).toFixed(1)).join(' ');return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="${p}" fill="none" stroke="var(--gold)" stroke-width="2"/></svg>`}
function grades(){
  $('#v').innerHTML=`<div class="card"><h3>ثبت نمره‌ی جدید</h3><div class="row"><select id="gs">${S.subjects.map((o,i)=>`<option value="${i}">${esc(o.n)}</option>`).join('')}</select><input id="gv" type="number" min="0" max="20" step="0.25" placeholder="نمره از ۲۰"><button class="btn" onclick="addG()">ثبت</button></div></div>
  <div class="grid">${S.subjects.map((o,i)=>{const a=avgOf(o),tg=o.target||18;return`<div class="card"><div class="row"><b>${esc(o.n)}</b><span class="mu">میانگین ${a===null?'—':fa(a)}</span></div>
  <div class="bar"><div><i style="width:${a===null?0:Math.min(100,a/tg*100)}%"></i></div><span class="mu">هدف ${fa(tg)}</span></div>${spark(o.scores)}
  <div class="chips" style="margin:6px 0">${o.scores.map((s,j)=>`<span class="chip" title="حذف" onclick="delG(${i},${j})">${fa(s)} ✕</span>`).join('')||'<span class="mu">نمره‌ای نیست</span>'}</div>
  <label>نمره‌ی هدف</label><input type="number" min="1" max="20" value="${tg}" onchange="setTg(${i},this.value)"></div>`}).join('')}</div>`;
}
function setTg(i,v){S.subjects[i].target=Math.min(20,Math.max(1,+v||18));sv();render()}
function timer(){
  $('#v').innerHTML=`<div class="card" style="text-align:center"><h3>${tm.mode==='work'?'زمان تمرکز':'زمان استراحت'}</h3><div class="big" id="tt">${fmt(tm.left)}</div>
  <div class="row" style="max-width:420px;margin:0 auto"><select id="ts">${S.subjects.map(o=>`<option ${o.n===tm.sub?'selected':''}>${esc(o.n)}</option>`).join('')}</select>
  <select id="td" onchange="setW(+this.value)">${[[1500,'۲۵ دقیقه'],[2700,'۴۵ دقیقه'],[3600,'۶۰ دقیقه']].map(x=>`<option value="${x[0]}" ${x[0]===tm.w?'selected':''}>${x[1]}</option>`).join('')}</select></div>
  <div class="row" style="justify-content:center"><button class="btn" onclick="tgT()">${tm.run?'توقف':'شروع'}</button><button class="btn g" onclick="rsT()">بازنشانی</button></div>
  <p class="mu">تایمر با عوض‌کردن تب ادامه می‌دهد. هر دوره‌ی کامل در گزارش مطالعه ثبت می‌شود.</p></div>`;
}
function setW(v){tm.w=v;if(!tm.run&&tm.mode==='work'){tm.left=v;timer()}}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=660;o.start();o.stop(a.currentTime+.4)}catch(e){}}
function tick(){
  tm.left--;
  if(tm.left<=0){clearInterval(tm.id);tm.run=false;
    if(tm.mode==='work'){S.log.push({k:'t'+Date.now(),d:today(),sub:tm.sub||(S.subjects[0]||{}).n||'—',min:Math.round(tm.w/60)});sv();tm.mode='rest';tm.left=tm.w>=2700?600:300;toast('آفرین! یک دوره ثبت شد')}
    else{tm.mode='work';tm.left=tm.w}
    beep();if(tab==='timer')timer();return}
  const e=$('#tt');if(e)e.textContent=fmt(tm.left)
}
function tgT(){
  if(tm.run){clearInterval(tm.id);tm.run=false;timer();return}
  const s=$('#ts');if(s)tm.sub=s.value;
  tm.run=true;tm.id=setInterval(tick,1000);timer();
}
function rsT(){clearInterval(tm.id);tm.run=false;tm.mode='work';tm.left=tm.w;timer()}
function todo(){
  const ex=S.exams.map((e,i)=>({...e,i})).sort((a,b)=>a.d<b.d?-1:1),tk=S.tasks.map((t,i)=>({...t,i})).sort((a,b)=>a.x-b.x);
  $('#v').innerHTML=`<div class="grid"><div class="card"><h3>تکالیف</h3>
  <div class="row"><input id="tn" placeholder="تکلیف چیست؟"><input id="td2" type="date"></div><button class="btn" onclick="addT()">افزودن</button>
  ${tk.map(t=>`<div class="it ${t.x?'dn':''}"><input type="checkbox" ${t.x?'checked':''} onchange="S.tasks[${t.i}].x=!S.tasks[${t.i}].x;sv();render()"><span class="g1">${esc(t.n)}</span><span class="mu">${t.d?new Date(t.d+'T00:00').toLocaleDateString('fa-IR'):''}</span><button class="btn r s" onclick="S.tasks.splice(${t.i},1);sv();render()">حذف</button></div>`).join('')}</div>
  <div class="card"><h3>امتحان‌ها</h3><div class="row"><input id="en" placeholder="نام امتحان"><input id="ed" type="date"></div><button class="btn" onclick="addE()">افزودن</button>
  ${ex.map(e=>{const d=Math.ceil((new Date(e.d+'T00:00')-new Date(today()+'T00:00'))/864e5);return`<div class="it"><span class="g1">${esc(e.n)}</span><span class="${d<0?'mu':d<=3?'bad':'ok'}">${d<0?'گذشته':fa(d)+' روز'}</span><button class="btn r s" onclick="S.exams.splice(${e.i},1);sv();render()">حذف</button></div>`}).join('')}</div></div>`;
}
function addT(){const n=$('#tn').value.trim();if(!n)return;S.tasks.push({n,d:$('#td2').value,x:false});sv();render()}
if(U)render();
</script>
</body>
</html>
