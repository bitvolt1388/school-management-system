<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>چت گروهی واقعی</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: #1a2332;
            --bg-input: #0d1522;
            --border-color: #2a3d5c;
            --text-primary: #e8f0fe;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --accent-green: #22d3ee;
            --accent-yellow: #fbbf24;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--accent-blue); border-radius: 10px; }

        .app {
            width: 1000px;
            max-width: 100%;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.04);
            height: calc(100vh - 32px);
            max-height: 800px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .app::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(59, 130, 246, 0.03), transparent, rgba(139, 92, 246, 0.03), transparent);
            animation: rotateGlow 40s linear infinite;
            pointer-events: none;
        }
        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== AUTH ===== */
        .auth-container {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(10, 14, 26, 0.95);
            backdrop-filter: blur(20px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius);
        }
        .auth-container.active { display: flex; }
        .auth-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: var(--shadow);
            animation: modalPop 0.3s ease;
            position: relative;
            z-index: 101;
        }
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .auth-box .logo {
            font-size: 28px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 6px;
        }
        .auth-box .subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 24px;
        }
        .auth-box .form-group {
            margin-bottom: 14px;
        }
        .auth-box .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .auth-box .form-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: var(--transition);
        }
        .auth-box .form-group input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .auth-box .btn-full {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.25);
        }
        .auth-box .btn-full:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
        }
        .auth-box .auth-switch {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .auth-box .auth-switch a {
            color: var(--accent-blue);
            cursor: pointer;
            text-decoration: none;
            font-weight: 600;
        }
        .auth-box .auth-switch a:hover { text-decoration: underline; }
        .auth-box .error-msg {
            color: #ef4444;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            display: none;
        }
        .auth-box .error-msg.show { display: block; }

        /* ===== HEADER ===== */
        .header {
            display: none;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            background: var(--bg-card);
            border-radius: 60px;
            border: 1px solid var(--border-color);
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
            position: relative;
            z-index: 1;
        }
        .header.active { display: flex; }
        .header .brand {
            font-size: 20px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header .user-info .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: white;
        }
        .header .user-info .name {
            font-size: 14px;
            font-weight: 600;
        }
        .header .online-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--accent-green);
            background: rgba(34, 211, 238, 0.1);
            padding: 4px 14px;
            border-radius: 30px;
            border: 1px solid rgba(34, 211, 238, 0.15);
        }
        .header .online-badge .dot {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulseDot 1.8s infinite;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.7); }
        }
        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.3);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
        }

        /* ===== CHAT AREA ===== */
        .chat-area {
            display: none;
            flex: 1;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            flex-direction: column;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }
        .chat-area.active { display: flex; }

        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 18px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .chat-header .info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-header .info .icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
        }
        .chat-header .info .title {
            font-size: 15px;
            font-weight: 700;
        }
        .chat-header .info .status {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .chat-header .info .status.online {
            color: var(--accent-green);
        }

        /* ===== MESSAGES ===== */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px 18px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: var(--bg-input);
        }
        .chat-messages .empty {
            text-align: center;
            color: var(--text-secondary);
            padding: 60px 0;
            font-size: 15px;
        }
        .chat-messages .empty i {
            font-size: 40px;
            display: block;
            margin-bottom: 12px;
            color: var(--border-color);
        }

        .message {
            max-width: 82%;
            padding: 8px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            animation: msgIn 0.15s ease;
        }
        .message.own {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.other {
            background: var(--bg-card);
            color: var(--text-primary);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }
        .message.system {
            background: rgba(251, 191, 36, 0.1);
            border: 1px solid rgba(251, 191, 36, 0.2);
            color: var(--accent-yellow);
            align-self: center;
            max-width: 90%;
            text-align: center;
            font-size: 13px;
            padding: 6px 20px;
            border-radius: 30px;
        }
        .message .msg-user {
            font-weight: 700;
            font-size: 12px;
            color: var(--accent-yellow);
            display: block;
            margin-bottom: 2px;
        }
        .message .msg-time {
            font-size: 10px;
            color: var(--text-secondary);
            margin-right: 8px;
        }
        .message.own .msg-time {
            color: rgba(255, 255, 255, 0.6);
        }
        .message .msg-seen {
            font-size: 11px;
            color: var(--accent-green);
            margin-right: 4px;
        }
        .message .msg-media {
            max-width: 100%;
            border-radius: 12px;
            margin: 4px 0;
            cursor: pointer;
        }
        .message .msg-media img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .message .msg-media video {
            max-width: 100%;
            max-height: 250px;
            border-radius: 12px;
            background: #000;
        }
        .message .msg-audio {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 6px 12px;
            background: var(--bg-input);
            border-radius: 30px;
            margin: 4px 0;
            min-width: 180px;
        }
        .message .msg-audio audio {
            flex: 1;
            height: 30px;
            border-radius: 20px;
        }
        .message .msg-audio audio::-webkit-media-controls-panel {
            background: var(--bg-input);
        }
        .message .msg-file {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            background: var(--bg-input);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            margin: 4px 0;
        }
        .message .msg-file i {
            font-size: 22px;
            color: var(--accent-blue);
        }
        .message .msg-file .file-info {
            flex: 1;
        }
        .message .msg-file .file-info .name {
            font-size: 13px;
            font-weight: 600;
        }
        .message .msg-file .file-info .size {
            font-size: 11px;
            color: var(--text-secondary);
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== TYPING ===== */
        .typing-indicator {
            padding: 4px 18px;
            font-size: 12px;
            color: var(--text-secondary);
            min-height: 28px;
            display: none;
            align-items: center;
            gap: 6px;
        }
        .typing-indicator.show { display: flex; }
        .typing-indicator .dots span {
            display: inline-block;
            width: 5px;
            height: 5px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typingDot 1.4s infinite;
            margin: 0 1px;
        }
        .typing-indicator .dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingDot {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-5px); opacity: 1; }
        }

        /* ===== INPUT ===== */
        .chat-input-area {
            display: flex;
            gap: 8px;
            padding: 8px 14px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-card);
            flex-shrink: 0;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .chat-input-area .wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border-radius: 40px;
            padding: 2px 6px 2px 14px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
            min-width: 0;
        }
        .chat-input-area .wrapper:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .chat-input-area .wrapper input {
            flex: 1;
            padding: 9px 6px;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
            min-width: 50px;
        }
        .chat-input-area .wrapper input::placeholder {
            color: var(--text-secondary);
        }
        .chat-input-area .wrapper .tool-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 5px;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .chat-input-area .wrapper .tool-btn:hover {
            color: var(--accent-yellow);
        }
        .chat-input-area .wrapper .tool-btn.record {
            color: #ef4444;
        }
        .chat-input-area .wrapper .tool-btn.record.recording {
            animation: pulseRecord 1s infinite;
        }
        @keyframes pulseRecord {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        .chat-input-area .send-btn {
            padding: 9px 20px;
            border: none;
            border-radius: 40px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .chat-input-area .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
        }

        /* ===== TOAST ===== */
        .toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            max-width: 90%;
        }
        .toast {
            padding: 10px 22px;
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            animation: slideUp 0.3s ease;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
        }
        .toast.success { border-color: #10b981; }
        .toast.error { border-color: #ef4444; }
        .toast.info { border-color: var(--accent-blue); }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .app { padding: 10px; height: calc(100vh - 20px); max-height: none; }
            .header { padding: 6px 12px; }
            .header .brand { font-size: 16px; }
            .message { max-width: 92%; font-size: 13px; padding: 6px 12px; }
            .chat-messages { padding: 10px 12px; }
            .chat-input-area { padding: 6px 8px; gap: 4px; }
            .chat-input-area .wrapper input { font-size: 13px; padding: 7px 4px; }
            .chat-input-area .send-btn { padding: 7px 14px; font-size: 13px; }
            .auth-box { padding: 24px 20px; margin: 10px; }
        }
    </style>
</head>
<body>

    <div class="app" id="app">

        <!-- ===== AUTH ===== -->
        <div class="auth-container active" id="authContainer">
            <div class="auth-box">
                <div class="logo">💬 چت‌گروهی</div>
                <div class="subtitle">به جمع دوستان خود بپیوندید</div>
                <form id="authForm">
                    <div class="form-group">
                        <label>نام کاربری</label>
                        <input type="text" id="authUsername" placeholder="نام خود را وارد کنید..." required />
                    </div>
                    <div class="form-group" id="passGroup">
                        <label>رمز عبور</label>
                        <input type="password" id="authPassword" placeholder="رمز عبور..." required />
                    </div>
                    <div class="form-group" id="confirmGroup" style="display:none;">
                        <label>تکرار رمز عبور</label>
                        <input type="password" id="authConfirm" placeholder="تکرار رمز عبور..." />
                    </div>
                    <button type="submit" class="btn-full" id="authSubmitBtn">ورود</button>
                    <div class="error-msg" id="authError"></div>
                </form>
                <div class="auth-switch">
                    <span id="authSwitchText">حساب کاربری ندارید؟</span>
                    <a id="authSwitchBtn">ثبت‌نام</a>
                </div>
            </div>
        </div>

        <!-- ===== HEADER ===== -->
        <header class="header" id="appHeader">
            <span class="brand">💬 چت‌گروهی</span>
            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                <div class="online-badge">
                    <span class="dot"></span>
                    <span id="onlineCount">۱</span> آنلاین
                </div>
                <div class="user-info">
                    <div class="avatar" id="userAvatar">م</div>
                    <span class="name" id="userName">مهمان</span>
                </div>
                <button class="btn btn-danger" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> خروج
                </button>
            </div>
        </header>

        <!-- ===== CHAT ===== -->
        <main class="chat-area" id="chatArea">
            <div class="chat-header">
                <div class="info">
                    <div class="icon">👥</div>
                    <div>
                        <div class="title">گروه عمومی</div>
                        <div class="status online" id="chatStatus">🟢 همه آنلاین</div>
                    </div>
                </div>
                <div>
                    <button class="btn btn-primary" id="clearChatBtn" style="padding:4px 12px;font-size:11px;">
                        <i class="fas fa-trash-alt"></i> پاک کردن
                    </button>
                </div>
            </div>

            <div class="chat-messages" id="chatMessages">
                <div class="empty">
                    <i class="fas fa-comment-dots"></i>
                    هیچ پیامی وجود ندارد<br />
                    <span style="font-size:13px;color:var(--text-secondary);">اولین پیام را شما ارسال کنید!</span>
                </div>
            </div>

            <div class="typing-indicator" id="typingIndicator">
                <span>✏️</span>
                <span id="typingText">در حال تایپ...</span>
                <span class="dots"><span></span><span></span><span></span></span>
            </div>

            <div class="chat-input-area">
                <div class="wrapper">
                    <button class="tool-btn" id="emojiBtn">😊</button>
                    <button class="tool-btn" id="attachBtn">📎</button>
                    <button class="tool-btn record" id="recordBtn">🎤</button>
                    <input type="text" id="chatInput" placeholder="پیام خود را بنویسید..." />
                    <input type="file" id="fileInput" accept="image/*,video/*" style="display:none;" multiple />
                </div>
                <button class="send-btn" id="sendBtn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </main>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ============================================================
        //  ساخته شده توسط هوشمند
        //  چت گروهی واقعی - همه پیام‌ها را همه می‌بینند
        //  با استفاده از Broadcast Channel API
        // ============================================================

        // ---- BROADCAST CHANNEL (ارسال پیام بین همه پنجره‌ها) ----
        const channel = new BroadcastChannel('chat_group_channel');

        // ---- STATE ----
        const state = {
            currentUser: null,
            users: JSON.parse(localStorage.getItem('groupchat_users') || '[]'),
            messages: JSON.parse(localStorage.getItem('groupchat_messages') || '[]'),
            isRecording: false,
            mediaRecorder: null,
            audioChunks: [],
        };

        // ---- DOM REFS ----
        const $ = id => document.getElementById(id);
        const authContainer = $('authContainer');
        const authForm = $('authForm');
        const authUsername = $('authUsername');
        const authPassword = $('authPassword');
        const authConfirm = $('authConfirm');
        const confirmGroup = $('confirmGroup');
        const passGroup = $('passGroup');
        const authSubmitBtn = $('authSubmitBtn');
        const authError = $('authError');
        const authSwitchBtn = $('authSwitchBtn');
        const authSwitchText = $('authSwitchText');
        const appHeader = $('appHeader');
        const chatArea = $('chatArea');
        const chatMessages = $('chatMessages');
        const chatInput = $('chatInput');
        const sendBtn = $('sendBtn');
        const userName = $('userName');
        const userAvatar = $('userAvatar');
        const onlineCount = $('onlineCount');
        const typingIndicator = $('typingIndicator');
        const typingText = $('typingText');
        const fileInput = $('fileInput');
        const attachBtn = $('attachBtn');
        const emojiBtn = $('emojiBtn');
        const recordBtn = $('recordBtn');
        const logoutBtn = $('logoutBtn');
        const clearChatBtn = $('clearChatBtn');
        const toastContainer = $('toastContainer');

        let isLoginMode = true;
        let typingTimeout = null;

        // ---- HELPERS ----
        function getTime() {
            const now = new Date();
            return String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / 1048576).toFixed(1) + ' MB';
        }

        function showToast(message, type = 'info') {
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
            el.innerHTML = `${icons[type] || 'ℹ️'} ${message}`;
            toastContainer.appendChild(el);
            setTimeout(() => { el.remove(); }, 3000);
        }

        function saveData() {
            localStorage.setItem('groupchat_users', JSON.stringify(state.users));
            localStorage.setItem('groupchat_messages', JSON.stringify(state.messages));
        }

        // ---- BROADCAST: دریافت پیام از سایر کاربران ----
        channel.onmessage = (event) => {
            const data = event.data;
            
            if (data.type === 'new_message') {
                // پیام جدید از کاربر دیگر
                state.messages.push(data.message);
                saveData();
                renderMessages();
                showToast(`📩 ${data.message.username}: ${data.message.text || 'رسانه'}`, 'info');
            }
            
            if (data.type === 'typing') {
                // نمایش تایپ کاربر دیگر
                typingIndicator.classList.add('show');
                typingText.textContent = `${data.username} در حال تایپ...`;
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    typingIndicator.classList.remove('show');
                }, 3000);
            }
            
            if (data.type === 'user_joined') {
                showToast(`👋 ${data.username} به جمع ما پیوست!`, 'success');
                updateOnlineCount();
            }
            
            if (data.type === 'user_left') {
                showToast(`👋 ${data.username} خارج شد`, 'info');
                updateOnlineCount();
            }
            
            if (data.type === 'clear_chat') {
                state.messages = [];
                saveData();
                renderMessages();
                showToast('🧹 چت توسط ادمین پاک شد', 'warning');
            }
        };

        // ---- BROADCAST: ارسال پیام به همه ----
        function broadcastMessage(type, data) {
            channel.postMessage({ type, ...data });
        }

        // ---- AUTH ----
        function switchAuthMode() {
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                authSubmitBtn.textContent = 'ورود';
                authSwitchText.textContent = 'حساب کاربری ندارید؟';
                authSwitchBtn.textContent = 'ثبت‌نام';
                confirmGroup.style.display = 'none';
                passGroup.style.display = 'block';
                authConfirm.removeAttribute('required');
            } else {
                authSubmitBtn.textContent = 'ثبت‌نام';
                authSwitchText.textContent = 'حساب کاربری دارید؟';
                authSwitchBtn.textContent = 'ورود';
                confirmGroup.style.display = 'block';
                passGroup.style.display = 'block';
                authConfirm.setAttribute('required', 'required');
            }
            authError.classList.remove('show');
            authError.textContent = '';
        }

        authSwitchBtn.addEventListener('click', switchAuthMode);

        authForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = authUsername.value.trim();
            const password = authPassword.value.trim();
            authError.classList.remove('show');
            authError.textContent = '';

            if (!username || !password) {
                authError.textContent = '❌ لطفاً همه فیلدها را پر کنید';
                authError.classList.add('show');
                return;
            }

            if (isLoginMode) {
                const user = state.users.find(u => u.username === username && u.password === password);
                if (!user) {
                    authError.textContent = '❌ نام کاربری یا رمز عبور اشتباه است';
                    authError.classList.add('show');
                    return;
                }
                loginUser(user);
            } else {
                const confirm = authConfirm.value.trim();
                if (password !== confirm) {
                    authError.textContent = '❌ رمز عبور و تکرار آن مطابقت ندارند';
                    authError.classList.add('show');
                    return;
                }
                if (state.users.find(u => u.username === username)) {
                    authError.textContent = '❌ این نام کاربری قبلاً ثبت شده است';
                    authError.classList.add('show');
                    return;
                }
                const colors = ['#3b82f6', '#8b5cf6', '#ec4899', '#f97316', '#22d3ee', '#10b981', '#fbbf24', '#ef4444'];
                const newUser = {
                    username,
                    password,
                    color: colors[Math.floor(Math.random() * colors.length)],
                };
                state.users.push(newUser);
                saveData();
                showToast('✅ ثبت‌نام با موفقیت انجام شد!', 'success');
                loginUser(newUser);
            }
        });

        function loginUser(user) {
            state.currentUser = user;
            localStorage.setItem('groupchat_current_user', user.username);
            
            authContainer.classList.remove('active');
            appHeader.classList.add('active');
            chatArea.classList.add('active');
            
            userName.textContent = user.username;
            userAvatar.textContent = user.username[0].toUpperCase();
            userAvatar.style.background = `linear-gradient(135deg, ${user.color}, ${user.color}dd)`;
            
            updateOnlineCount();
            renderMessages();
            
            showToast(`👋 خوش آمدید ${user.username}!`, 'success');
            
            // اطلاع به دیگران
            broadcastMessage('user_joined', { username: user.username });
            
            // پیام خوش‌آمدگویی در چت
            setTimeout(() => {
                addSystemMessage(`👋 ${user.username} به جمع ما پیوست!`);
            }, 500);
        }

        function updateOnlineCount() {
            // تعداد کاربران آنلاین = همه کاربران ثبت‌شده (شبیه‌سازی)
            onlineCount.textContent = state.users.length;
        }

        // ---- LOGOUT ----
        logoutBtn.addEventListener('click', () => {
            const username = state.currentUser?.username;
            state.currentUser = null;
            localStorage.removeItem('groupchat_current_user');
            
            appHeader.classList.remove('active');
            chatArea.classList.remove('active');
            authContainer.classList.add('active');
            
            authUsername.value = '';
            authPassword.value = '';
            authConfirm.value = '';
            if (!isLoginMode) switchAuthMode();
            
            showToast('👋 شما خارج شدید', 'info');
            
            if (username) {
                broadcastMessage('user_left', { username });
            }
        });

        // ---- MESSAGES ----
        function renderMessages() {
            chatMessages.innerHTML = '';
            
            if (state.messages.length === 0) {
                chatMessages.innerHTML = `
                    <div class="empty">
                        <i class="fas fa-comment-dots"></i>
                        هیچ پیامی وجود ندارد<br />
                        <span style="font-size:13px;color:var(--text-secondary);">اولین پیام را شما ارسال کنید!</span>
                    </div>
                `;
                return;
            }

            state.messages.forEach((msg) => {
                const div = document.createElement('div');
                const isOwn = msg.username === state.currentUser?.username;
                
                if (msg.username === 'سیستم') {
                    div.className = 'message system';
                    div.textContent = msg.text;
                } else {
                    div.className = `message ${isOwn ? 'own' : 'other'}`;
                    
                    let content = '';
                    if (!isOwn) {
                        content += `<span class="msg-user">${msg.username}</span>`;
                    }
                    
                    if (msg.text) content += msg.text;
                    
                    if (msg.image) {
                        content += `<div class="msg-media"><img src="${msg.image}" alt="تصویر" onclick="window.open('${msg.image}','_blank')" /></div>`;
                    }
                    if (msg.video) {
                        content += `<div class="msg-media"><video controls src="${msg.video}"></video></div>`;
                    }
                    if (msg.audio) {
                        content += `<div class="msg-audio"><audio controls src="${msg.audio}"></audio></div>`;
                    }
                    if (msg.file) {
                        const icon = msg.fileType?.startsWith('image') ? 'fa-image' :
                                    msg.fileType?.startsWith('video') ? 'fa-video' : 'fa-file';
                        content += `
                            <div class="msg-file" onclick="window.open('${msg.file}','_blank')">
                                <i class="fas ${icon}"></i>
                                <div class="file-info">
                                    <div class="name">${msg.fileName || 'فایل'}</div>
                                    <div class="size">${msg.fileSize || ''}</div>
                                </div>
                            </div>
                        `;
                    }
                    
                    content += ` <span class="msg-time">${msg.time}</span>`;
                    if (isOwn) content += ` <span class="msg-seen">✓✓</span>`;
                    
                    div.innerHTML = content;
                }
                
                chatMessages.appendChild(div);
            });
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addMessage(text, type = 'text', mediaData = null) {
            if (!state.currentUser) return;
            
            const msg = {
                username: state.currentUser.username,
                text: text || '',
                time: getTime(),
            };

            if (type === 'image' && mediaData) msg.image = mediaData;
            else if (type === 'video' && mediaData) msg.video = mediaData;
            else if (type === 'audio' && mediaData) msg.audio = mediaData;
            else if (type === 'file' && mediaData) {
                msg.file = mediaData.data;
                msg.fileName = mediaData.name;
                msg.fileSize = mediaData.size;
                msg.fileType = mediaData.type;
            }

            // ذخیره محلی
            state.messages.push(msg);
            saveData();
            renderMessages();
            
            // پخش به همه کاربران دیگر
            broadcastMessage('new_message', { message: msg });
        }

        function addSystemMessage(text) {
            const msg = {
                username: 'سیستم',
                text: text,
                time: getTime(),
            };
            state.messages.push(msg);
            saveData();
            renderMessages();
            broadcastMessage('new_message', { message: msg });
        }

        // ---- SEND ----
        function sendMessage() {
            const text = chatInput.value.trim();
            if (text) {
                addMessage(text);
                chatInput.value = '';
            }
            typingIndicator.classList.remove('show');
        }

        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // ---- TYPING ----
        chatInput.addEventListener('input', () => {
            if (chatInput.value.trim()) {
                // ارسال تایپ به دیگران
                broadcastMessage('typing', { username: state.currentUser?.username });
            }
        });

        // ---- EMOJI ----
        const emojis = ['😊', '😂', '❤️', '🔥', '🎯', '👍', '👏', '💪', '🎉', '✨', '🌟', '😍', '🥰', '😘', '🤩', '🙌', '👀', '💯', '⚡', '🎵', '🎶'];
        emojiBtn.addEventListener('click', () => {
            chatInput.value += emojis[Math.floor(Math.random() * emojis.length)];
            chatInput.focus();
        });

        // ---- ATTACH ----
        attachBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const files = e.target.files;
            if (!files.length) return;

            for (const file of files) {
                if (file.size > 20 * 1024 * 1024) {
                    showToast('❌ حجم فایل نباید بیشتر از ۲۰ مگابایت باشد', 'error');
                    continue;
                }

                const reader = new FileReader();
                reader.onload = (event) => {
                    const data = event.target.result;
                    if (file.type.startsWith('image/')) {
                        addMessage('📷 تصویر', 'image', data);
                        showToast('📷 تصویر ارسال شد', 'success');
                    } else if (file.type.startsWith('video/')) {
                        addMessage('🎬 ویدیو', 'video', data);
                        showToast('🎬 ویدیو ارسال شد', 'success');
                    } else {
                        addMessage('📎 فایل', 'file', {
                            data: data,
                            name: file.name,
                            size: formatFileSize(file.size),
                            type: file.type
                        });
                        showToast('📎 فایل ارسال شد', 'success');
                    }
                };
                reader.readAsDataURL(file);
            }
            fileInput.value = '';
        });

        // ---- VOICE ----
        recordBtn.addEventListener('click', async () => {
            if (state.isRecording) {
                if (state.mediaRecorder && state.mediaRecorder.state === 'recording') {
                    state.mediaRecorder.stop();
                }
                state.isRecording = false;
                recordBtn.classList.remove('recording');
                recordBtn.innerHTML = '🎤';
                showToast('⏹ ضبط متوقف شد', 'info');
                return;
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                state.mediaRecorder = new MediaRecorder(stream);
                state.audioChunks = [];

                state.mediaRecorder.ondataavailable = (event) => {
                    state.audioChunks.push(event.data);
                };

                state.mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(state.audioChunks, { type: 'audio/wav' });
                    const reader = new FileReader();
                    reader.onload = () => {
                        addMessage('🎤 ویسی مسیج', 'audio', reader.result);
                        showToast('🎤 ویسی مسیج ارسال شد', 'success');
                    };
                    reader.readAsDataURL(audioBlob);
                    stream.getTracks().forEach(track => track.stop());
                };

                state.mediaRecorder.start();
                state.isRecording = true;
                recordBtn.classList.add('recording');
                recordBtn.innerHTML = '⏹';
                showToast('🎤 در حال ضبط... کلیک کنید تا متوقف شود', 'warning');
            } catch (err) {
                showToast('❌ دسترسی به میکروفون امکان‌پذیر نیست', 'error');
                console.error(err);
            }
        });

        // ---- CLEAR CHAT ----
        clearChatBtn.addEventListener('click', () => {
            if (confirm('آیا مطمئن هستید؟ تمام پیام‌ها پاک می‌شوند.')) {
                state.messages = [];
                saveData();
                renderMessages();
                broadcastMessage('clear_chat', {});
                showToast('🧹 چت پاک شد', 'warning');
            }
        });

        // ---- INIT ----
        function init() {
            const savedUser = localStorage.getItem('groupchat_current_user');
            if (savedUser) {
                const user = state.users.find(u => u.username === savedUser);
                if (user) {
                    loginUser(user);
                    return;
                }
            }
            authContainer.classList.add('active');
            appHeader.classList.remove('active');
            chatArea.classList.remove('active');
        }

        // ---- DRAG & DROP ----
        document.addEventListener('dragover', (e) => e.preventDefault());
        document.addEventListener('drop', (e) => {
            e.preventDefault();
            const files = e.dataTransfer.files;
            if (files.length) {
                fileInput.files = files;
                fileInput.dispatchEvent(new Event('change'));
            }
        });

        init();
        console.log('✅ ساخته شده توسط هوشمند');
        console.log('💬 چت گروهی واقعی - همه پیام‌ها را همه می‌بینند');
        console.log('📡 با استفاده از Broadcast Channel API');
    </script>
</body>
</html>
