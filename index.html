<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>چت‌سریع | پیام‌رسان آنلاین</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet" />
    
    <style>
        /* ============================================================
           RESET & ROOT
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: #1a2332;
            --bg-input: #0d1522;
            --border-color: #2a3d5c;
            --text-primary: #e8f0fe;
            --text-secondary: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --accent-green: #22d3ee;
            --accent-yellow: #fbbf24;
            --accent-orange: #f97316;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background-image: radial-gradient(ellipse at 10% 20%, rgba(59, 130, 246, 0.06) 0%, transparent 50%),
                              radial-gradient(ellipse at 90% 80%, rgba(139, 92, 246, 0.06) 0%, transparent 50%);
        }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--accent-blue); border-radius: 10px; }

        /* ============================================================
           APP
           ============================================================ */
        .app {
            width: 1280px;
            max-width: 100%;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            position: relative;
            overflow: hidden;
            height: calc(100vh - 32px);
            max-height: 820px;
            display: flex;
            flex-direction: column;
        }
        .app::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(59, 130, 246, 0.03), transparent, rgba(139, 92, 246, 0.03), transparent);
            animation: rotateGlow 40s linear infinite;
            pointer-events: none;
        }
        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 24px 8px 24px;
            background: var(--bg-card);
            border-radius: 60px;
            border: 1px solid var(--border-color);
            position: relative;
            z-index: 1;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-brand .logo {
            font-size: 24px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-brand .logo-sub {
            font-size: 13px;
            color: var(--text-secondary);
            -webkit-text-fill-color: var(--text-secondary);
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(34, 211, 238, 0.1);
            padding: 5px 16px 5px 14px;
            border-radius: 40px;
            border: 1px solid rgba(34, 211, 238, 0.15);
            font-size: 13px;
            color: var(--accent-green);
        }
        .status-badge .dot {
            width: 8px;
            height: 8px;
            background: var(--accent-green);
            border-radius: 50%;
            animation: pulseDot 1.8s infinite;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.7); }
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--bg-input);
            padding: 4px 16px 4px 6px;
            border-radius: 40px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: var(--transition);
        }
        .user-profile:hover {
            border-color: var(--accent-blue);
        }
        .user-profile .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 15px;
            color: white;
            flex-shrink: 0;
        }
        .user-profile .username {
            font-size: 14px;
            font-weight: 600;
        }
        .btn {
            padding: 7px 18px;
            border: none;
            border-radius: 40px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.25);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.35);
        }
        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .btn-secondary:hover {
            background: var(--border-color);
        }
        .btn-success {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }

        /* ============================================================
           MAIN GRID
           ============================================================ */
        .main-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 16px;
            flex: 1;
            min-height: 0;
            position: relative;
            z-index: 1;
        }
        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            .sidebar {
                max-height: 200px;
            }
        }

        /* ============================================================
           SIDEBAR - Contacts
           ============================================================ */
        .sidebar {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sidebar-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-title span {
            background: var(--accent-blue);
            color: white;
            padding: 0 10px;
            border-radius: 20px;
            font-size: 11px;
        }
        .sidebar-search {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            background: var(--bg-input);
            border-radius: 40px;
            padding: 4px 12px;
            border: 1px solid var(--border-color);
        }
        .sidebar-search input {
            flex: 1;
            padding: 8px 4px;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 13px;
            font-family: inherit;
            outline: none;
        }
        .sidebar-search input::placeholder {
            color: var(--text-secondary);
        }
        .sidebar-search i {
            color: var(--text-secondary);
            align-self: center;
        }
        .contact-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            cursor: pointer;
            border: 1px solid transparent;
        }
        .contact-item:hover {
            background: var(--bg-input);
            border-color: var(--border-color);
        }
        .contact-item.active {
            background: rgba(59, 130, 246, 0.12);
            border-color: var(--accent-blue);
        }
        .contact-item .avatar-sm {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            color: white;
            flex-shrink: 0;
            position: relative;
        }
        .contact-item .avatar-sm .online-dot {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid var(--bg-card);
        }
        .contact-item .avatar-sm .online-dot.online {
            background: #22d3ee;
        }
        .contact-item .avatar-sm .online-dot.offline {
            background: #475569;
        }
        .contact-item .info {
            flex: 1;
            min-width: 0;
        }
        .contact-item .info .name {
            font-size: 14px;
            font-weight: 600;
        }
        .contact-item .info .last-msg {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .contact-item .info .last-msg .sender {
            color: var(--text-secondary);
        }
        .contact-item .time-badge {
            font-size: 10px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }
        .contact-item .unread {
            background: var(--accent-blue);
            color: white;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
            flex-shrink: 0;
        }

        /* ============================================================
           CHAT AREA
           ============================================================ */
        .chat-area {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .chat-header .chat-user {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-header .chat-user .avatar-md {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: white;
        }
        .chat-header .chat-user .info .name {
            font-size: 15px;
            font-weight: 700;
        }
        .chat-header .chat-user .info .status {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .chat-header .chat-user .info .status.online {
            color: var(--accent-green);
        }
        .chat-header .chat-actions {
            display: flex;
            gap: 8px;
        }
        .chat-header .chat-actions button {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: var(--transition);
        }
        .chat-header .chat-actions button:hover {
            background: var(--bg-input);
            color: var(--text-primary);
        }

        /* ============================================================
           MESSAGES
           ============================================================ */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            background: var(--bg-input);
        }
        .chat-messages .date-divider {
            text-align: center;
            font-size: 11px;
            color: var(--text-secondary);
            padding: 12px 0 8px;
            position: relative;
        }
        .chat-messages .date-divider::before {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 1px;
            background: var(--border-color);
            opacity: 0.3;
        }
        .chat-messages .date-divider span {
            background: var(--bg-input);
            padding: 0 16px;
            position: relative;
            z-index: 1;
        }

        .message {
            max-width: 82%;
            padding: 8px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.6;
            word-wrap: break-word;
            animation: msgIn 0.15s ease;
            position: relative;
        }
        .message.own {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.other {
            background: var(--bg-card);
            color: var(--text-primary);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid var(--border-color);
        }
        .message .msg-user {
            font-weight: 700;
            font-size: 12px;
            color: var(--accent-yellow);
            display: block;
            margin-bottom: 2px;
        }
        .message .msg-time {
            font-size: 10px;
            color: var(--text-secondary);
            margin-right: 8px;
        }
        .message.own .msg-time {
            color: rgba(255, 255, 255, 0.6);
        }
        .message .msg-seen {
            font-size: 11px;
            color: var(--accent-green);
            margin-right: 4px;
        }
        .message .msg-reply {
            font-size: 12px;
            color: var(--text-secondary);
            background: var(--bg-input);
            padding: 4px 12px;
            border-radius: 8px;
            border-right: 3px solid var(--accent-blue);
            margin-bottom: 4px;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(6px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ============================================================
           TYPING INDICATOR
           ============================================================ */
        .typing-indicator {
            padding: 4px 20px;
            font-size: 12px;
            color: var(--text-secondary);
            font-style: italic;
            min-height: 28px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .typing-indicator .dots {
            display: flex;
            gap: 3px;
        }
        .typing-indicator .dots span {
            width: 6px;
            height: 6px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typingDot 1.4s infinite;
        }
        .typing-indicator .dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingDot {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* ============================================================
           CHAT INPUT
           ============================================================ */
        .chat-input-area {
            display: flex;
            gap: 10px;
            padding: 10px 16px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-card);
            flex-shrink: 0;
            align-items: center;
        }
        .chat-input-area .input-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            background: var(--bg-input);
            border-radius: 40px;
            padding: 2px 6px 2px 16px;
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }
        .chat-input-area .input-wrapper:focus-within {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        .chat-input-area .input-wrapper input {
            flex: 1;
            padding: 10px 8px;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            outline: none;
        }
        .chat-input-area .input-wrapper input::placeholder {
            color: var(--text-secondary);
        }
        .chat-input-area .input-wrapper .emoji-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 22px;
            cursor: pointer;
            padding: 4px 6px;
            transition: var(--transition);
        }
        .chat-input-area .input-wrapper .emoji-btn:hover {
            color: var(--accent-yellow);
        }
        .chat-input-area .input-wrapper .attach-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 18px;
            cursor: pointer;
            padding: 4px 6px;
            transition: var(--transition);
        }
        .chat-input-area .input-wrapper .attach-btn:hover {
            color: var(--accent-blue);
        }
        .chat-input-area .send-btn {
            padding: 10px 22px;
            border: none;
            border-radius: 40px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .chat-input-area .send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.3);
        }
        .chat-input-area .send-btn:active {
            transform: scale(0.95);
        }

        /* ============================================================
           MODAL
           ============================================================ */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--shadow);
            animation: modalPop 0.25s ease;
        }
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-box h2 {
            font-size: 22px;
            margin-bottom: 6px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .modal-box p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 18px;
        }
        .modal-box input {
            width: 100%;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
            margin-bottom: 12px;
            outline: none;
            transition: var(--transition);
        }
        .modal-box input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
        .modal-box .color-picker {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .modal-box .color-picker .color-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: var(--transition);
        }
        .modal-box .color-picker .color-btn:hover {
            transform: scale(1.1);
        }
        .modal-box .color-picker .color-btn.active {
            border-color: white;
            box-shadow: 0 0 0 2px var(--bg-primary);
        }
        .modal-box .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
            max-width: 90%;
        }
        .toast {
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            animation: slideUp 0.3s ease;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            backdrop-filter: blur(10px);
        }
        .toast.success { border-color: #10b981; }
        .toast.error { border-color: #ef4444; }
        .toast.info { border-color: var(--accent-blue); }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 600px) {
            .app { padding: 10px; height: calc(100vh - 20px); max-height: none; }
            .header { padding: 6px 12px; }
            .header-brand .logo { font-size: 18px; }
            .header-brand .logo-sub { display: none; }
            .status-badge { font-size: 11px; padding: 4px 10px; }
            .user-profile .username { font-size: 12px; }
            .btn { font-size: 11px; padding: 5px 12px; }
            .message { max-width: 92%; font-size: 13px; padding: 6px 12px; }
            .chat-messages { padding: 10px 12px; }
            .chat-input-area { padding: 8px 10px; gap: 6px; }
            .chat-input-area .input-wrapper input { font-size: 13px; padding: 8px 4px; }
            .chat-input-area .send-btn { padding: 8px 16px; font-size: 13px; }
            .sidebar { max-height: 180px; }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    MAIN APP
    ============================================================ -->
    <div class="app" id="app">

        <!-- HEADER -->
        <header class="header">
            <div class="header-brand">
                <span class="logo">💬 چت‌سریع</span>
                <span class="logo-sub">| پیام‌رسان آنلاین</span>
            </div>
            <div class="header-right">
                <div class="status-badge">
                    <span class="dot"></span>
                    <span id="onlineCount">۱۸</span> آنلاین
                </div>
                <div class="user-profile" id="profileBtn">
                    <div class="avatar" id="userAvatar">م</div>
                    <span class="username" id="userName">مهمان</span>
                </div>
                <button class="btn btn-primary" id="shareBtn">
                    <i class="fas fa-share-alt"></i> دعوت
                </button>
            </div>
        </header>

        <!-- MAIN GRID -->
        <div class="main-grid">

            <!-- SIDEBAR: Contacts -->
            <aside class="sidebar">
                <div class="sidebar-title">
                    <span><i class="fas fa-users"></i> مخاطبین</span>
                    <span id="contactCount">۱۲</span>
                </div>
                <div class="sidebar-search">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="جستجوی مخاطب..." />
                </div>
                <div class="contact-list" id="contactList">
                    <!-- dynamically generated -->
                </div>
            </aside>

            <!-- CHAT AREA -->
            <main class="chat-area">
                <!-- Chat Header -->
                <div class="chat-header">
                    <div class="chat-user">
                        <div class="avatar-md" id="chatAvatar" style="background:linear-gradient(135deg,#8b5cf6,#ec4899);">ع</div>
                        <div class="info">
                            <div class="name" id="chatUserName">علی رضایی</div>
                            <div class="status online" id="chatUserStatus">🟢 آنلاین</div>
                        </div>
                    </div>
                    <div class="chat-actions">
                        <button title="جستجو"><i class="fas fa-search"></i></button>
                        <button title="اطلاعات"><i class="fas fa-info-circle"></i></button>
                        <button title="بیشتر"><i class="fas fa-ellipsis-v"></i></button>
                    </div>
                </div>

                <!-- Messages -->
                <div class="chat-messages" id="chatMessages">
                    <!-- messages go here -->
                </div>

                <!-- Typing Indicator -->
                <div class="typing-indicator" id="typingIndicator">
                    <span style="color:var(--text-secondary);">✏️</span>
                    <span id="typingText">در حال تایپ...</span>
                    <span class="dots" id="typingDots">
                        <span></span><span></span><span></span>
                    </span>
                </div>

                <!-- Input -->
                <div class="chat-input-area">
                    <div class="input-wrapper">
                        <button class="emoji-btn" id="emojiBtn">😊</button>
                        <input type="text" id="chatInput" placeholder="پیام خود را بنویسید..." />
                        <button class="attach-btn"><i class="fas fa-paperclip"></i></button>
                    </div>
                    <button class="send-btn" id="sendBtn">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </main>
        </div>
    </div>

    <!-- ============================================================
    MODAL: Profile
    ============================================================ -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal-box">
            <h2>👤 پروفایل</h2>
            <p>نام و رنگ خود را انتخاب کنید تا دوستانتان شما را بشناسند.</p>
            <input type="text" id="modalNameInput" placeholder="نام کاربری..." value="مهمان" />
            <div class="color-picker" id="colorPicker">
                <button class="color-btn active" style="background:#3b82f6;" data-color="#3b82f6"></button>
                <button class="color-btn" style="background:#8b5cf6;" data-color="#8b5cf6"></button>
                <button class="color-btn" style="background:#ec4899;" data-color="#ec4899"></button>
                <button class="color-btn" style="background:#f97316;" data-color="#f97316"></button>
                <button class="color-btn" style="background:#22d3ee;" data-color="#22d3ee"></button>
                <button class="color-btn" style="background:#10b981;" data-color="#10b981"></button>
                <button class="color-btn" style="background:#fbbf24;" data-color="#fbbf24"></button>
                <button class="color-btn" style="background:#ef4444;" data-color="#ef4444"></button>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="modalCancelBtn">لغو</button>
                <button class="btn btn-primary" id="modalSaveBtn">ذخیره</button>
            </div>
        </div>
    </div>

    <!-- ============================================================
    TOAST
    ============================================================ -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        // ============================================================
        //  ساخته شده توسط هوشمند
        //  چت‌سریع - پیام‌رسان آنلاین با کیفیت تلگرام
        //  سرعت بالا، رابط کاربری حرفه‌ای، کاملاً رنگارنگ
        // ============================================================

        // ---- STATE ----
        const state = {
            username: 'مهمان',
            userColor: '#3b82f6',
            activeContact: 0,
            contacts: [
                { id: 0, name: 'علی رضایی', color: '#8b5cf6', online: true, lastMsg: 'سلام! چطوری؟', time: '۱۲:۳۰', unread: 2 },
                { id: 1, name: 'سارا محمدی', color: '#ec4899', online: true, lastMsg: 'باشه میام', time: '۱۲:۱۵', unread: 0 },
                { id: 2, name: 'رضا کریمی', color: '#f97316', online: false, lastMsg: 'فردا می‌بینمت', time: '۱۱:۴۵', unread: 0 },
                { id: 3, name: 'نرگس احمدی', color: '#22d3ee', online: true, lastMsg: '😊 عالی', time: '۱۱:۲۰', unread: 1 },
                { id: 4, name: 'امیر حسینی', color: '#10b981', online: true, lastMsg: 'حتماً', time: '۱۰:۵۵', unread: 0 },
                { id: 5, name: 'زهرا موسوی', color: '#fbbf24', online: false, lastMsg: 'خب پس فردا', time: '۱۰:۱۰', unread: 0 },
                { id: 6, name: 'حسین نادری', color: '#3b82f6', online: true, lastMsg: '👍', time: '۰۹:۴۰', unread: 0 },
                { id: 7, name: 'مریم رحیمی', color: '#8b5cf6', online: true, lastMsg: 'چشم', time: '۰۹:۰۵', unread: 0 },
                { id: 8, name: 'کیان صابری', color: '#ec4899', online: false, lastMsg: 'نیستم', time: '۰۸:۳۰', unread: 0 },
                { id: 9, name: 'ندا امیری', color: '#f97316', online: true, lastMsg: 'سلام', time: '۰۸:۰۰', unread: 0 },
                { id: 10, name: 'پویا رستمی', color: '#22d3ee', online: true, lastMsg: 'باشه', time: '۰۷:۲۰', unread: 0 },
                { id: 11, name: 'شیدا زارعی', color: '#10b981', online: false, lastMsg: 'خب', time: '۰۶:۵۰', unread: 0 },
            ],
            messages: {
                0: [
                    { user: 'علی رضایی', text: 'سلام! چطوری؟', time: '۱۲:۲۸', isOwn: false },
                    { user: 'من', text: 'سلام علی! خوبم تو چطوری؟', time: '۱۲:۲۹', isOwn: true },
                    { user: 'علی رضایی', text: 'منم خوبم! داستان جدید نوشتی؟', time: '۱۲:۳۰', isOwn: false },
                ],
                1: [
                    { user: 'سارا محمدی', text: 'سلام وقت بخیر', time: '۱۲:۱۰', isOwn: false },
                    { user: 'من', text: 'سلام سارا! وقت بخیر', time: '۱۲:۱۲', isOwn: true },
                    { user: 'سارا محمدی', text: 'باشه میام', time: '۱۲:۱۵', isOwn: false },
                ],
                3: [
                    { user: 'نرگس احمدی', text: 'عکس رو دیدی؟', time: '۱۱:۱۵', isOwn: false },
                    { user: 'من', text: 'آره خیلی قشنگ بود', time: '۱۱:۱۸', isOwn: true },
                    { user: 'نرگس احمدی', text: '😊 عالی', time: '۱۱:۲۰', isOwn: false },
                ],
            }
        };

        // ---- DOM REFS ----
        const $ = id => document.getElementById(id);
        const contactList = $('contactList');
        const contactCount = $('contactCount');
        const onlineCount = $('onlineCount');
        const chatMessages = $('chatMessages');
        const chatInput = $('chatInput');
        const sendBtn = $('sendBtn');
        const chatUserName = $('chatUserName');
        const chatUserStatus = $('chatUserStatus');
        const chatAvatar = $('chatAvatar');
        const typingIndicator = $('typingIndicator');
        const typingText = $('typingText');
        const userName = $('userName');
        const userAvatar = $('userAvatar');
        const profileModal = $('profileModal');
        const modalNameInput = $('modalNameInput');
        const toastContainer = $('toastContainer');
        const searchInput = $('searchInput');

        // ---- HELPERS ----
        function getTime() {
            const now = new Date();
            return String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        }

        function showToast(message, type = 'info') {
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            const icons = { success: '✅', error: '❌', info: 'ℹ️', warning: '⚠️' };
            el.innerHTML = `${icons[type] || 'ℹ️'} ${message}`;
            toastContainer.appendChild(el);
            setTimeout(() => { el.remove(); }, 3000);
        }

        // ---- RENDER CONTACTS ----
        function renderContacts(filter = '') {
            contactList.innerHTML = '';
            const filtered = state.contacts.filter(c => 
                c.name.includes(filter) || filter === ''
            );
            filtered.forEach((c, idx) => {
                const div = document.createElement('div');
                div.className = `contact-item ${state.activeContact === c.id ? 'active' : ''}`;
                const initial = c.name[0];
                div.innerHTML = `
                    <div class="avatar-sm" style="background:${c.color}">
                        ${initial}
                        <span class="online-dot ${c.online ? 'online' : 'offline'}"></span>
                    </div>
                    <div class="info">
                        <div class="name">${c.name}</div>
                        <div class="last-msg">
                            ${c.lastMsg ? `<span class="sender">${c.lastMsg.substring(0, 30)}${c.lastMsg.length > 30 ? '...' : ''}</span>` : ''}
                        </div>
                    </div>
                    <div class="time-badge">${c.time || ''}</div>
                    ${c.unread > 0 ? `<span class="unread">${c.unread}</span>` : ''}
                `;
                div.addEventListener('click', () => {
                    state.activeContact = c.id;
                    renderContacts(searchInput.value);
                    loadChat(c.id);
                });
                contactList.appendChild(div);
            });
            contactCount.textContent = filtered.length;
            const online = state.contacts.filter(c => c.online).length;
            onlineCount.textContent = online;
        }

        // ---- LOAD CHAT ----
        function loadChat(contactId) {
            const contact = state.contacts.find(c => c.id === contactId);
            if (!contact) return;
            chatUserName.textContent = contact.name;
            chatAvatar.textContent = contact.name[0];
            chatAvatar.style.background = `linear-gradient(135deg, ${contact.color}, ${contact.color}dd)`;
            chatUserStatus.textContent = contact.online ? '🟢 آنلاین' : '⚫ آفلاین';
            chatUserStatus.className = `status ${contact.online ? 'online' : ''}`;

            // Load messages
            const msgs = state.messages[contactId] || [];
            chatMessages.innerHTML = '';
            if (msgs.length === 0) {
                chatMessages.innerHTML = '<div style="text-align:center;color:var(--text-secondary);padding:40px 0;font-size:14px;">💬 پیامی وجود ندارد</div>';
                return;
            }
            // Add date divider
            const dateDiv = document.createElement('div');
            dateDiv.className = 'date-divider';
            dateDiv.innerHTML = `<span>امروز</span>`;
            chatMessages.appendChild(dateDiv);

            msgs.forEach(m => {
                const div = document.createElement('div');
                div.className = `message ${m.isOwn ? 'own' : 'other'}`;
                if (!m.isOwn) {
                    div.innerHTML = `<span class="msg-user">${m.user}</span>`;
                }
                div.innerHTML += `${m.text} <span class="msg-time">${m.time}</span>${m.isOwn ? ' <span class="msg-seen">✓✓</span>' : ''}`;
                chatMessages.appendChild(div);
            });
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // ---- SEND MESSAGE ----
        function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;
            const contactId = state.activeContact;
            const contact = state.contacts.find(c => c.id === contactId);
            if (!contact) return;

            // Add to messages
            if (!state.messages[contactId]) state.messages[contactId] = [];
            state.messages[contactId].push({
                user: state.username,
                text: text,
                time: getTime(),
                isOwn: true
            });

            // Update last message
            contact.lastMsg = text;
            contact.time = getTime();

            // Render
            loadChat(contactId);
            renderContacts(searchInput.value);
            chatInput.value = '';

            // Simulate typing
            typingIndicator.style.display = 'flex';
            typingText.textContent = `${contact.name} در حال تایپ...`;
            setTimeout(() => {
                typingIndicator.style.display = 'none';
                // Simulate reply
                const replies = ['👍 خوب!', 'چشم', 'عالی', '😄', 'مرسی', 'باشه', 'حتماً', 'خوبه', 'آره', 'نه', 'نمیدونم', '😊'];
                const reply = replies[Math.floor(Math.random() * replies.length)];
                if (!state.messages[contactId]) state.messages[contactId] = [];
                state.messages[contactId].push({
                    user: contact.name,
                    text: reply,
                    time: getTime(),
                    isOwn: false
                });
                contact.lastMsg = reply;
                contact.time = getTime();
                loadChat(contactId);
                renderContacts(searchInput.value);
                showToast(`📩 پیام از ${contact.name}`, 'info');
            }, 1200 + Math.random() * 1000);
        }

        // ---- PROFILE MODAL ----
        $('profileBtn').addEventListener('click', () => {
            modalNameInput.value = state.username;
            profileModal.classList.add('active');
            // Highlight current color
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.color === state.userColor);
            });
        });
        $('modalCancelBtn').addEventListener('click', () => {
            profileModal.classList.remove('active');
        });
        $('modalSaveBtn').addEventListener('click', () => {
            const name = modalNameInput.value.trim() || 'مهمان';
            state.username = name;
            userName.textContent = name;
            userAvatar.textContent = name[0].toUpperCase();
            userAvatar.style.background = `linear-gradient(135deg, ${state.userColor}, ${state.userColor}dd)`;
            profileModal.classList.remove('active');
            showToast(`👤 نام شما به "${name}" تغییر یافت`, 'success');
            renderContacts(searchInput.value);
        });
        // Color picker
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                state.userColor = btn.dataset.color;
                userAvatar.style.background = `linear-gradient(135deg, ${state.userColor}, ${state.userColor}dd)`;
            });
        });
        profileModal.addEventListener('click', (e) => {
            if (e.target === profileModal) profileModal.classList.remove('active');
        });

        // ---- SHARE ----
        $('shareBtn').addEventListener('click', () => {
            const url = window.location.href;
            if (navigator.share) {
                navigator.share({ title: 'چت‌سریع', text: 'به چت‌سریع بپیوند!', url });
            } else {
                navigator.clipboard.writeText(url).then(() => {
                    showToast('🔗 لینک کپی شد!', 'success');
                }).catch(() => {
                    showToast('📋 لینک: ' + url, 'info');
                });
            }
        });

        // ---- EMOJI ----
        $('emojiBtn').addEventListener('click', () => {
            const emojis = ['😊', '😂', '❤️', '🔥', '🎯', '👍', '👏', '💪', '🎉', '✨', '🌟', '😍', '🥰', '😘', '🤩', '🙌', '👀', '💯', '🔥', '⚡'];
            const e = emojis[Math.floor(Math.random() * emojis.length)];
            chatInput.value += e;
            chatInput.focus();
        });

        // ---- EVENTS ----
        sendBtn.addEventListener('click', sendMessage);
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // ---- SEARCH ----
        searchInput.addEventListener('input', () => {
            renderContacts(searchInput.value);
        });

        // ---- TYPING INDICATOR ----
        chatInput.addEventListener('input', () => {
            typingIndicator.style.display = 'flex';
            const contact = state.contacts.find(c => c.id === state.activeContact);
            typingText.textContent = contact ? `${contact.name} در حال تایپ...` : 'در حال تایپ...';
            clearTimeout(window.typingTimeout);
            window.typingTimeout = setTimeout(() => {
                typingIndicator.style.display = 'none';
            }, 1200);
        });

        // ---- INIT ----
        function init() {
            userAvatar.textContent = state.username[0].toUpperCase();
            userAvatar.style.background = `linear-gradient(135deg, ${state.userColor}, ${state.userColor}dd)`;
            userName.textContent = state.username;
            renderContacts();
            loadChat(0);
            typingIndicator.style.display = 'none';
            showToast('💬 به چت‌سریع خوش آمدید!', 'success');
            
            // Random welcome
            setTimeout(() => {
                const welcomes = ['سلام!', 'خوش آمدید!', 'چطورید؟', 'به جمع ما بپیوندید!'];
                const msg = welcomes[Math.floor(Math.random() * welcomes.length)];
                const contact = state.contacts.find(c => c.id === 0);
                if (contact) {
                    if (!state.messages[0]) state.messages[0] = [];
                    state.messages[0].push({
                        user: contact.name,
                        text: msg,
                        time: getTime(),
                        isOwn: false
                    });
                    contact.lastMsg = msg;
                    loadChat(0);
                    renderContacts();
                }
            }, 1000);
        }

        init();
        console.log('✅ ساخته شده توسط هوشمند');
        console.log('💬 چت‌سریع - پیام‌رسان آنلاین');
    </script>
</body>
</html>
